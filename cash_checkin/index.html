<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>現地払いチェックイン</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    :root{
      --bg0:#06070a; --bg1:#0b0d12;
      --card1: rgba(255,255,255,.075);
      --card2: rgba(255,255,255,.04);
      --line: rgba(255,255,255,.12);
      --text:#eaf0ff; --muted:rgba(234,240,255,.72);
      --accent:#7c5cff; --accent2:#2dd4bf;
      --ok:#22c55e; --ng:#ff4d6d; --warn:#fbbf24;
      --radius:18px;
      --shadow: 0 20px 70px rgba(0,0,0,.55);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
      color:var(--text);
      background:
        radial-gradient(1200px 800px at 20% 0%, rgba(124,92,255,.24), transparent 60%),
        radial-gradient(900px 700px at 90% 20%, rgba(45,212,191,.18), transparent 55%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      min-height:100vh;
      padding: calc(14px + env(safe-area-inset-top)) 14px calc(22px + env(safe-area-inset-bottom));
      display:flex; justify-content:center;
    }
    .wrap{ width:min(560px, 100%); }
    .card{
      background: linear-gradient(180deg, var(--card1), var(--card2));
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
    }
    .head{
      padding:16px 16px 12px;
      border-bottom:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.02);
    }
    h1{
      margin:0 0 6px;
      font-size:18px;
      font-weight:900;
      letter-spacing:.2px;
    }
    .sub{ margin:0; color:var(--muted); font-size:12px; line-height:1.55; }
    .content{ padding:14px 16px 0; }

    .grid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:10px;
    }
    @media (max-width:420px){
      .grid{ grid-template-columns: 1fr; }
    }
    .item{
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
      border-radius:14px;
      padding:12px;
    }
    .label{ color:var(--muted); font-size:12px; margin-bottom:6px; }
    .value{ font-weight:900; letter-spacing:.2px; }
    .fee{ font-size:24px; font-weight:1000; letter-spacing:.3px; }

    .badge{
      display:inline-flex; align-items:center; gap:8px;
      padding:8px 12px;
      border-radius:999px;
      font-weight:1000;
      font-size:12px;
      border:1px solid;
      white-space:nowrap;
      width: fit-content;
    }
    .dot{ width:9px; height:9px; border-radius:50%; }
    .ok{ border-color: rgba(34,197,94,.45); background: rgba(34,197,94,.18); }
    .ok .dot{ background: var(--ok); }
    .ng{ border-color: rgba(255,77,109,.40); background: rgba(255,77,109,.14); }
    .ng .dot{ background: var(--ng); }
    .warn{ border-color: rgba(251,191,36,.38); background: rgba(251,191,36,.12); }
    .warn .dot{ background: var(--warn); }

    .sep{ height:1px; background:rgba(255,255,255,.10); margin:14px 0; }

    select, input{
      width:100%;
      padding:14px 14px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(255,255,255,.04);
      color:var(--text);
      outline:none;
      font-size:16px;
    }
    .hint{ color:var(--muted); font-size:12px; line-height:1.6; margin-top:8px; }

    pre{
      margin:12px 0 0;
      white-space:pre-wrap;
      background:rgba(255,255,255,.035);
      border:1px solid rgba(255,255,255,.10);
      padding:12px;
      border-radius:14px;
      color:rgba(234,240,255,.88);
      font-size:12px;
      line-height:1.55;
    }

    .actionBar{
      position: sticky;
      bottom: 0;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      background: linear-gradient(180deg, rgba(11,13,18,0), rgba(11,13,18,.75) 22%, rgba(11,13,18,.95));
      border-top: 1px solid rgba(255,255,255,.08);
    }
    .btn{
      width:100%;
      border:none;
      border-radius:16px;
      padding:16px 14px;
      font-size:16px;
      font-weight:1000;
      letter-spacing:.2px;
      color:#0b0d12;
      background: linear-gradient(135deg, rgba(124,92,255,.98), rgba(45,212,191,.92));
      cursor:pointer;
      transition: transform .06s ease, opacity .15s ease;
      box-shadow: 0 14px 40px rgba(124,92,255,.18);
    }
    .btn:active{ transform: translateY(1px); }
    .btn[disabled]{ opacity:.55; cursor:not-allowed; box-shadow:none; }

    .btnSub{
      width:100%;
      border-radius:16px;
      padding:14px 14px;
      font-size:14px;
      font-weight:900;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(255,255,255,.04);
      color:var(--text);
      cursor:pointer;
    }
    .btnSub[disabled]{ opacity:.55; cursor:not-allowed; }

    .statusLine{
      margin-top:10px;
      color: rgba(234,240,255,.78);
      font-size:12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .pill{
      padding:6px 10px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.03);
      color: rgba(234,240,255,.78);
      font-weight:900;
      white-space:nowrap;
    }

    .hide{ display:none; }

    .err{
      margin-top:10px;
      color:#ff98ad;
      font-size:12px;
      white-space:pre-wrap;
    }
  </style>
</head>

<body>
  <!-- BUILD: 2026-02-08_cash_checkin_member_gate_v2_bindfix -->
  <div class="wrap">

    <!-- ====== SCREEN 1: 会員確認（ページ） ====== -->
    <div id="screenVerify" class="card hide">
      <div class="head">
        <h1>会員確認</h1>
        <p class="sub">
          電話番号（入会フォームの「緊急連絡先」）で会員を特定します。<br>
          <strong>確認が完了するとチェックイン画面に移動</strong>します。
        </p>
      </div>

      <div class="content">
        <div class="label">電話番号（ハイフンなし）</div>
        <input id="verifyPhone" inputmode="numeric" placeholder="例：08012345678" />
        <div class="hint">一度確認できれば、以後は自動でスキップされることがあります。</div>

        <div id="verifySelectBox" class="hide" style="margin-top:12px;">
          <div class="label">同じ電話番号の候補が複数あります（選択）</div>
          <select id="verifyMemberSel"></select>
          <div class="hint">候補を選んだら、もう一度「会員確認して続行」を押してください。</div>
        </div>

        <div class="sep"></div>

        <div class="label">結果</div>
        <pre id="outVerify">—</pre>

        <div id="verifyErr" class="err"></div>

        <div style="height:14px"></div>
      </div>

      <div class="actionBar">
        <button class="btn" id="btnVerifyOk" type="button">会員確認して続行</button>
        <button class="btnSub" id="btnVerifyCancel" type="button" style="margin-top:10px;">キャンセル（閉じる）</button>
        <div class="statusLine">
          <div id="verifyStatus">起動中…</div>
          <div class="pill">本人確認</div>
        </div>
      </div>
    </div>

    <!-- ====== SCREEN 2: チェックイン ====== -->
    <div id="screenCheckin" class="card hide">
      <div class="head">
        <h1>現地払いチェックイン</h1>
        <p class="sub">このQRは<strong>現地精算（PENDING）専用</strong>です。月謝契約の有無と単発料金を表示します。</p>
      </div>

      <div class="content">
        <div class="grid">
          <div class="item">
            <div class="label">会員</div>
            <div id="memberName" class="value">—</div>
          </div>
          <div class="item">
            <div class="label">区分</div>
            <div id="contractBadge" class="badge warn"><span class="dot"></span>—</div>
          </div>
          <div class="item">
            <div class="label">単発料金</div>
            <div id="fee" class="fee">—</div>
          </div>
          <div class="item">
            <div class="label">今月</div>
            <div id="yyyymm" class="value">—</div>
          </div>
        </div>

        <div class="sep"></div>

        <div class="label">クラス</div>
        <select id="classSel"></select>

        <div class="label" style="margin-top:12px;">結果</div>
        <pre id="out">—</pre>

        <div style="height:10px"></div>
      </div>

      <div class="actionBar">
        <button class="btn" id="btnCheckin" disabled>読み込み中…</button>
        <div class="statusLine">
          <div id="statusText">起動中…</div>
          <div class="pill">PENDING 記録</div>
        </div>
      </div>
    </div>

  </div>

<script>
  /* ====== 設定（必ず差し替え） ====== */
  const LIFF_ID   = "2008938862-M5N6CXP3";
  const API_URL   = "https://script.google.com/macros/s/AKfycby5I_79Y4b44ldbpM5tUBHtTF1hIOx9e0q1LMnA7K_bPzZ-VeYuDWkLo1nh4eQ82cNs/exec";
  const API_TOKEN = "sol_checkin_2026_144025036146";
  const STAMP_URL = "https://liff.line.me/1654883656-XqwKRkd4/?searchId=849rmjko&shopcardProgramId=01HG80PGE6KDYNYF61RB36SHHD&printablePointId=9cN1kUjyRBqOiexb4KelOfpruP63PRucZ7_BistMav0";
  /* =================================== */

  document.title = "cash_checkin BUILD 2026-02-08_cash_checkin_member_gate_v2_bindfix";

  const JSONP_TIMEOUT_MS = 16000;
  const $ = (id)=>document.getElementById(id);

  let gUserId = "";
  let gDisplayName = "";
  let RUNNING = false;

  // member_id（確定したら必ず入る）
  let gMemberId = "";

  // resolve_member で複数候補になった時の rowIndex
  let gSelectedRowIndex = 0;

  // ---------- error hooks（必ずoutに出す） ----------
  window.onerror = function(msg, src, line, col, err){
    try{
      const o = { where:"window.onerror", msg:String(msg), src:String(src), line, col, err:String(err && err.stack ? err.stack : err) };
      if ($("out")) $("out").textContent = JSON.stringify(o, null, 2);
      if ($("outVerify")) $("outVerify").textContent = JSON.stringify(o, null, 2);
      if ($("verifyErr")) $("verifyErr").textContent = "JSエラーで停止しました。\n" + JSON.stringify(o, null, 2);
    }catch(_){}
  };
  window.onunhandledrejection = function(ev){
    try{
      const r = ev && ev.reason;
      const o = { where:"unhandledrejection", reason:String(r && r.stack ? r.stack : r) };
      if ($("out")) $("out").textContent = JSON.stringify(o, null, 2);
      if ($("outVerify")) $("outVerify").textContent = JSON.stringify(o, null, 2);
      if ($("verifyErr")) $("verifyErr").textContent = "Promise例外で停止しました。\n" + JSON.stringify(o, null, 2);
    }catch(_){}
  };

  function setOut(obj){
    $("out").textContent = (typeof obj === "string") ? obj : JSON.stringify(obj, null, 2);
  }
  function setOutVerify(obj){
    $("outVerify").textContent = (typeof obj === "string") ? obj : JSON.stringify(obj, null, 2);
  }
  function setStatus(t){ $("statusText").textContent = t || ""; }
  function setVerifyStatus(t){ $("verifyStatus").textContent = t || ""; }

  function showVerifyScreen_(){
    $("screenCheckin").classList.add("hide");
    $("screenVerify").classList.remove("hide");
  }
  function showCheckinScreen_(){
    $("screenVerify").classList.add("hide");
    $("screenCheckin").classList.remove("hide");
  }

  function withTimeout(p, ms, label){
    let t;
    const timeout = new Promise((_, rej)=> t=setTimeout(()=>rej(new Error(label+" timeout")), ms));
    return Promise.race([p, timeout]).finally(()=>clearTimeout(t));
  }

  function jsonp(url){
    return new Promise((resolve, reject)=>{
      const cb = "cb_" + Math.random().toString(36).slice(2);
      const script = document.createElement("script");
      const timer = setTimeout(()=>{
        cleanup();
        reject(new Error("JSONP timeout"));
      }, JSONP_TIMEOUT_MS);

      function cleanup(){
        clearTimeout(timer);
        try { delete window[cb]; } catch(_){}
        script.remove();
      }
      window[cb] = (data)=>{ cleanup(); resolve(data); };

      script.src = url + (url.includes("?") ? "&" : "?") + "callback=" + cb;
      script.onerror = ()=>{ cleanup(); reject(new Error("jsonp load error")); };
      document.body.appendChild(script);
    });
  }

  function yyyymmNowJst(){
    const now = new Date();
    const utc = now.getTime() + now.getTimezoneOffset() * 60000;
    const jst = new Date(utc + 9 * 60 * 60000);
    const y = jst.getFullYear();
    const m = String(jst.getMonth()+1).padStart(2,"0");
    return `${y}${m}`;
  }

  function normPhone_(s){
    s = String(s || '').trim().replace(/[^\d]/g,'');
    if (s.length < 10) return "";
    if (s.length > 11) return s.slice(-11);
    return s;
  }

  function getQueryParam_(k){
    try{
      const u = new URL(location.href);
      return String(u.searchParams.get(k) || "").trim();
    }catch(e){
      return "";
    }
  }

  function setMemberUiLocked_(){
    $("memberName").textContent = "(未確定)";
    const badge = $("contractBadge");
    badge.innerHTML = '<span class="dot"></span>未確定';
    badge.className = "badge warn";
    $("fee").textContent = "—";
  }

  function applyMeToUi_(me){
    $("memberName").textContent = me.member_name || "(不明)";
    const badge = $("contractBadge");
    badge.innerHTML = '<span class="dot"></span>' + (me.is_contract ? "月謝会員" : "通常会員");
    badge.className = "badge " + (me.is_contract ? "ok" : "ng");
    $("fee").textContent = `¥${Number(me.dropin_fee||0).toLocaleString()}`;
  }

  async function fetchMeByMemberId_(memberId){
    const url = `${API_URL}?api=me_by_member_id&token=${encodeURIComponent(API_TOKEN)}&member_id=${encodeURIComponent(memberId)}`;
    return await jsonp(url);
  }

  async function fetchMeCashByUserId_(){
    const meUrl = `${API_URL}?api=me_cash&token=${encodeURIComponent(API_TOKEN)}&userId=${encodeURIComponent(gUserId)}`;
    return await jsonp(meUrl);
  }

  let gVerifyCandidates = []; // 追加：候補を保持

  function setVerifyCandidates_(cands){
    gVerifyCandidates = Array.isArray(cands) ? cands : [];
  
    const box = $("verifySelectBox");
    const sel = $("verifyMemberSel");
    sel.innerHTML = "";
  
    gVerifyCandidates.forEach((c, i)=>{
      const opt = document.createElement("option");
      // ★ value は rowIndex（サーバが確実に解釈できる）
      opt.value = String(c.rowIndex || "");
      opt.textContent = `${c.member_name || "(不明)"}${c.member_type ? " / "+c.member_type : ""}（候補${i+1}）`;
      sel.appendChild(opt);
    });
  
    // ★初期選択＝1件目を確定
    gSelectedRowIndex = Number(sel.value || 0);
    const hit0 = gVerifyCandidates.find(x => Number(x.rowIndex) === gSelectedRowIndex);
    if (hit0 && hit0.member_id) gMemberId = String(hit0.member_id);
  
    sel.onchange = ()=>{
      gSelectedRowIndex = Number(sel.value || 0);
      const hit = gVerifyCandidates.find(x => Number(x.rowIndex) === gSelectedRowIndex);
      if (hit && hit.member_id) gMemberId = String(hit.member_id);
    };
  
    box.classList.remove("hide");
  }


  function clearVerifyCandidates_(){
    $("verifySelectBox").classList.add("hide");
    $("verifyMemberSel").innerHTML = "";
    gSelectedRowIndex = 0;
  }

  async function ensureMemberInfoByMemberId_(){
    setStatus("会員情報を取得中…");
  
    // A) member_id で引く（優先）
    if (gMemberId){
      try{
        const r = await fetchMeByMemberId_(gMemberId);
        if (r && r.status === "success"){
          applyMeToUi_(r);
          setStatus("チェックイン可能");
          return true;
        }
        // 失敗は out に残してフォールバックへ
        setOut({ where:"me_by_member_id_failed_fallback_to_me_cash", member_id:gMemberId, r });
      }catch(e){
        setOut({ where:"me_by_member_id_exception_fallback_to_me_cash", member_id:gMemberId, error:String(e?.message||e) });
      }
    }
  
    // B) フォールバック：me_cash（resolve_memberで紐付いた後なら成功する想定）
    try{
      const me = await fetchMeCashByUserId_();
      if (me && me.status === "success"){
        if (me.member_id) gMemberId = String(me.member_id).trim();
        applyMeToUi_(me);
        setStatus("チェックイン可能");
        return true;
      }
      setOut({ where:"me_cash_failed", me });
      setStatus("失敗");
      return false;
    }catch(e){
      setOut({ where:"me_cash_exception", error:String(e?.message||e) });
      setStatus("失敗");
      return false;
    }
  }


  async function loadClasses_(){
    setOut("classes 読み込み中...");
    setStatus("クラス一覧を取得中…");

    const clsUrl = `${API_URL}?api=classes&token=${encodeURIComponent(API_TOKEN)}`;
    const cls = await jsonp(clsUrl);
    if (!cls || cls.status !== "success") {
      setOut({ where:"classes", clsUrl, cls });
      setStatus("失敗");
      return false;
    }

    const sel = $("classSel");
    sel.innerHTML = "";
    (cls.classes || []).forEach(c=>{
      const opt = document.createElement("option");
      opt.value = c.id;
      opt.textContent = c.name;
      sel.appendChild(opt);
    });

    return true;
  }

  async function goToCheckin_(){
    showCheckinScreen_();

    $("yyyymm").textContent = yyyymmNowJst();
    setMemberUiLocked_();

    const meOk = await ensureMemberInfoByMemberId_();
    const clsOk = await loadClasses_();

    $("btnCheckin").disabled = !(meOk && clsOk);
    $("btnCheckin").textContent = (meOk && clsOk) ? "現地精算でチェックイン（PENDING）" : "読み込み失敗";
    setOut(meOk ? "準備OK。" : "会員情報取得に失敗");

    if (!(meOk && clsOk)) return;

    $("btnCheckin").onclick = async ()=>{
      if (!gMemberId) return;

      if (RUNNING) return;
      RUNNING = true;

      $("btnCheckin").disabled = true;
      setStatus("チェックイン送信中…");

      try{
        const sel = $("classSel");
        const classId = sel.value;
        const className = sel.options[sel.selectedIndex]?.textContent || "";

        const url =
          `${API_URL}?api=checkin`
          + `&token=${encodeURIComponent(API_TOKEN)}`
          + `&cash=1`
          + `&member_id=${encodeURIComponent(gMemberId)}`
          + `&userId=${encodeURIComponent(gUserId)}`
          + `&displayName=${encodeURIComponent(gDisplayName)}`
          + `&classId=${encodeURIComponent(classId)}`
          + `&className=${encodeURIComponent(className)}`
          + (gSelectedRowIndex ? `&rowIndex=${encodeURIComponent(String(gSelectedRowIndex))}` : "");

        const res = await jsonp(url);
        setOut(res);

        if (res && res.status === "success") {
          const lines = [];
          if (res.pending === true) lines.push(res.pending_message || "本日は現地精算です。受付でお手続きください。");
          if (res.over_limit === true && res.over_message) lines.push(res.over_message);
          else if (res.month_count) lines.push(`今月の受講は ${res.month_count} 回目です。`);
          if (lines.length === 0) lines.push("チェックインが完了しました。");

          const text = lines.join("\n\n") + "\n\nOKでスタンプ付与へ移動します。";
          setStatus("確認待ち");

          const ok = confirm(text);
          if (ok) {
            setStatus("スタンプへ移動中…");
            try { liff.openWindow({ url: STAMP_URL, external: false }); }
            catch(e1){
              try { liff.openWindow({ url: STAMP_URL, external: true }); }
              catch(e2){ window.location.href = STAMP_URL; }
            }
          } else {
            setStatus("キャンセル");
          }
          return;
        }

        setStatus("エラー");
      } catch(err){
        setOut(String(err && err.message ? err.message : err));
        setStatus("通信失敗");
      } finally {
        RUNNING = false;
        $("btnCheckin").disabled = false;
      }
    };
  }

  // 会員確認（電話番号 → resolve_member）
  async function doResolveMember_(){
    try{
      if ($("btnVerifyOk")) $("btnVerifyOk").disabled = true;
      if ($("btnVerifyCancel")) $("btnVerifyCancel").disabled = true;

      if ($("verifyErr")) $("verifyErr").textContent = "";
      setOutVerify("照会中…");
      setVerifyStatus("照会中…");

      const phone = normPhone_($("verifyPhone") ? $("verifyPhone").value : "");
      if (!phone){
        if ($("verifyErr")) $("verifyErr").textContent = "電話番号を入力してください（ハイフンなし）";
        setVerifyStatus("入力待ち");
        return;
      }

      const url =
        `${API_URL}?api=resolve_member`
        + `&token=${encodeURIComponent(API_TOKEN)}`
        + `&userId=${encodeURIComponent(gUserId)}`
        + `&phone=${encodeURIComponent(phone)}`
        + (gSelectedRowIndex ? `&rowIndex=${encodeURIComponent(String(gSelectedRowIndex))}` : "");

      const r = await jsonp(url);

      if (r && r.status === "need_member_select"){
        setVerifyCandidates_(r.candidates || []);
        if ($("verifyErr")) $("verifyErr").textContent = "候補を選んで、もう一度「会員確認して続行」を押してください。";
        setOutVerify({ where:"resolve_member_need_select", url, r });
        setVerifyStatus("候補選択");
        return;
      }

      if (r && r.status === "success"){
        clearVerifyCandidates_();
        if (r.member_id) gMemberId = String(r.member_id || "").trim();

        setOutVerify({ where:"resolve_member_success", url, r });
        setVerifyStatus("完了");

        await goToCheckin_();
        return;
      }

      if ($("verifyErr")){
        $("verifyErr").textContent =
          "照会に失敗しました。\n" +
          "status=" + String(r && r.status) + "\n" +
          "message=" + String(r && r.message ? r.message : "(no message)");
      }
      setOutVerify({ where:"resolve_member_error", url, r });
      setVerifyStatus("失敗");

    } catch(err){
      if ($("verifyErr")) $("verifyErr").textContent = "通信失敗: " + String(err?.message || err);
      setOutVerify({ where:"resolve_member_exception", error:String(err?.message || err) });
      setVerifyStatus("失敗");
    } finally {
      if ($("btnVerifyOk")) $("btnVerifyOk").disabled = false;
      if ($("btnVerifyCancel")) $("btnVerifyCancel").disabled = false;
    }
  }

  // キャンセル：LIFFなら closeWindow、それ以外は “入力クリアして待機” に落とす（history.back依存を排除）
  function bindVerifyCancel_(){
    const btn = $("btnVerifyCancel");
    if (!btn) return;

    btn.type = "button";
    btn.addEventListener("click", (e)=>{
      e.preventDefault();
      e.stopPropagation();

      // 1) LIFF内なら閉じる
      try{
        if (window.liff && liff.isInClient && liff.isInClient()){
          liff.closeWindow();
          return;
        }
      }catch(_){}

      // 2) 履歴が無いケース対策：入力クリアで“戻った扱い”
      try{
        if ($("verifyPhone")) $("verifyPhone").value = "";
        if ($("verifyErr")) $("verifyErr").textContent = "";
        if ($("verifyStatus")) $("verifyStatus").textContent = "入力待ち";
        if ($("outVerify")) $("outVerify").textContent = "—";
        clearVerifyCandidates_();
      }catch(_){}
    }, true);
  }

  // Verify UIのバインドを「落ちない」「確実に付く」形に統一し、バインド完了をoutVerifyに表示
  function bindVerifyUI_(){
    const okBtn = $("btnVerifyOk");
    const cancelBtn = $("btnVerifyCancel");
    const phone = $("verifyPhone");
    const out = $("outVerify");
    const st = $("verifyStatus");

    if (!okBtn || !cancelBtn || !phone || !out || !st){
      throw new Error("Missing verify elements: "
        + JSON.stringify({
          ok: !!okBtn, cancel: !!cancelBtn, phone: !!phone, out: !!out, status: !!st
        })
      );
    }

    okBtn.type = "button";
    okBtn.addEventListener("click", (e)=>{
      e.preventDefault();
      e.stopPropagation();
      doResolveMember_();
    }, true);

    bindVerifyCancel_();

    setOutVerify({ where:"bindVerifyUI_", ok:true, at:new Date().toISOString() });
    setVerifyStatus("入力待ち");
  }

  async function main(){
    // 初期は verify を表示しておく（後で条件で切り替える）
    showVerifyScreen_();
    setVerifyStatus("LIFF初期化中…");
    setOutVerify("LIFF init...");

    // URLからmember_idを拾う（既に確定済みなら会員確認をスキップ）
    gMemberId = getQueryParam_("member_id");

    await withTimeout(liff.init({ liffId: LIFF_ID }), 20000, "liff.init");
    if (!liff.isLoggedIn()) { liff.login(); return; }

    const prof = await withTimeout(liff.getProfile(), 12000, "liff.getProfile");
    gUserId = prof.userId;
    gDisplayName = prof.displayName || "";

    // 1) member_id がURLにある → そのままチェックインへ
    if (gMemberId){
      setVerifyStatus("会員確認済み（member_id）");
      await goToCheckin_();
      return;
    }

    // 2) URLになければ、まず me_cash を試す（既に紐づいてる人はスキップ）
    try{
      const me = await fetchMeCashByUserId_();

      // 既に紐づいていて member_id も返るなら、そのままチェックインへ
      if (me && me.status === "success" && me.member_id){
        gMemberId = String(me.member_id).trim();
        setOutVerify({ where:"me_cash_success_skip_verify", me });
        setVerifyStatus("会員確認済み（自動）");
        await goToCheckin_();
        return;
      }

      // need_phone / 失敗 → 会員確認ページのまま
      setOutVerify({ where:"me_cash_need_verify", me });
      setVerifyStatus("電話番号入力が必要");
      showVerifyScreen_();

    }catch(e){
      setOutVerify({ where:"me_cash_exception", error:String(e?.message||e) });
      setVerifyStatus("電話番号入力が必要");
      showVerifyScreen_();
    }

    // ===== UI bind（ここが死ぬとボタン無反応になるので、必ず例外を出してoutVerifyに落とす） =====
    bindVerifyUI_();
  }

  main().catch(e=>{
    setOutVerify("FATAL: " + String(e && e.message ? e.message : e));
    setVerifyStatus("起動失敗");
  });
</script>
