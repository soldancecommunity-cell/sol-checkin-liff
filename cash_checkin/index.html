<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>現地払いチェックイン</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root{
      --bg0:#06070a; --bg1:#0b0d12;
      --card1: rgba(255,255,255,.075);
      --card2: rgba(255,255,255,.04);
      --line: rgba(255,255,255,.12);
      --text:#eaf0ff; --muted:rgba(234,240,255,.72);
      --accent:#7c5cff; --accent2:#2dd4bf;
      --ok:#22c55e; --ng:#ff4d6d; --warn:#fbbf24;
      --radius:18px;
      --shadow: 0 20px 70px rgba(0,0,0,.55);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
      color:var(--text);
      background:
        radial-gradient(1200px 800px at 20% 0%, rgba(124,92,255,.24), transparent 60%),
        radial-gradient(900px 700px at 90% 20%, rgba(45,212,191,.18), transparent 55%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      min-height:100vh;
      padding: calc(14px + env(safe-area-inset-top)) 14px calc(22px + env(safe-area-inset-bottom));
      display:flex; justify-content:center;
    }
    .wrap{ width:min(560px, 100%); }
    .card{
      background: linear-gradient(180deg, var(--card1), var(--card2));
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
    }
    .head{
      padding:16px 16px 12px;
      border-bottom:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.02);
    }
    h1{
      margin:0 0 6px;
      font-size:18px;
      font-weight:900;
      letter-spacing:.2px;
    }
    .sub{ margin:0; color:var(--muted); font-size:12px; line-height:1.55; }
    .content{ padding:14px 16px 0; }
    .grid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:10px;
    }
    @media (max-width:420px){
      .grid{ grid-template-columns: 1fr; }
    }
    .item{
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
      border-radius:14px;
      padding:12px;
    }
    .label{ color:var(--muted); font-size:12px; margin-bottom:6px; }
    .value{ font-weight:900; letter-spacing:.2px; }
    .fee{ font-size:24px; font-weight:1000; letter-spacing:.3px; }
    .badge{
      display:inline-flex; align-items:center; gap:8px;
      padding:8px 12px;
      border-radius:999px;
      font-weight:1000;
      font-size:12px;
      border:1px solid;
      white-space:nowrap;
      width: fit-content;
    }
    .dot{ width:9px; height:9px; border-radius:50%; }
    .ok{ border-color: rgba(34,197,94,.45); background: rgba(34,197,94,.18); }
    .ok .dot{ background: var(--ok); }
    .ng{ border-color: rgba(255,77,109,.40); background: rgba(255,77,109,.14); }
    .ng .dot{ background: var(--ng); }
    .warn{ border-color: rgba(251,191,36,.38); background: rgba(251,191,36,.12); }
    .warn .dot{ background: var(--warn); }

    .sep{ height:1px; background:rgba(255,255,255,.10); margin:14px 0; }

    select, input{
      width:100%;
      padding:14px 14px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(255,255,255,.04);
      color:var(--text);
      outline:none;
      font-size:16px;
    }
    .hint{ color:var(--muted); font-size:12px; line-height:1.6; margin-top:8px; }

    pre{
      margin:12px 0 0;
      white-space:pre-wrap;
      background:rgba(255,255,255,.035);
      border:1px solid rgba(255,255,255,.10);
      padding:12px;
      border-radius:14px;
      color:rgba(234,240,255,.88);
      font-size:12px;
      line-height:1.55;
    }

    .actionBar{
      position: sticky;
      bottom: 0;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      background: linear-gradient(180deg, rgba(11,13,18,0), rgba(11,13,18,.75) 22%, rgba(11,13,18,.95));
      border-top: 1px solid rgba(255,255,255,.08);
    }
    .btn{
      width:100%;
      border:none;
      border-radius:16px;
      padding:16px 14px;
      font-size:16px;
      font-weight:1000;
      letter-spacing:.2px;
      color:#0b0d12;
      background: linear-gradient(135deg, rgba(124,92,255,.98), rgba(45,212,191,.92));
      cursor:pointer;
      transition: transform .06s ease, opacity .15s ease;
      box-shadow: 0 14px 40px rgba(124,92,255,.18);
    }
    .btn:active{ transform: translateY(1px); }
    .btn[disabled]{ opacity:.55; cursor:not-allowed; box-shadow:none; }

    .statusLine{
      margin-top:10px;
      color: rgba(234,240,255,.78);
      font-size:12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .pill{
      padding:6px 10px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.03);
      color: rgba(234,240,255,.78);
      font-weight:900;
      white-space:nowrap;
    }
    .hide{ display:none; }
  </style>
</head>

<body>
  <!-- BUILD: 2026-02-08_member_resolve_modal_v1 -->
  <div class="wrap">
    <div class="card">
      <div class="head">
        <h1>現地払いチェックイン</h1>
        <p class="sub">このQRは<strong>現地精算（PENDING）専用</strong>です。月謝契約の有無と単発料金を表示します。</p>
      </div>

      <div class="content">
        <div class="grid">
          <div class="item">
            <div class="label">会員</div>
            <div id="memberName" class="value">読み込み中…</div>
          </div>
          <div class="item">
            <div class="label">区分</div>
            <div id="contractBadge" class="badge warn"><span class="dot"></span>判定中</div>
          </div>
          <div class="item">
            <div class="label">単発料金</div>
            <div id="fee" class="fee">—</div>
          </div>
          <div class="item">
            <div class="label">今月</div>
            <div id="yyyymm" class="value">—</div>
          </div>
        </div>

        <div class="sep"></div>

        <div class="label">クラス</div>
        <select id="classSel"></select>

        <!-- 互換用：以前の phoneBox（今回は基本モーダルで取るが残してOK） -->
        <div id="phoneBox" class="hide" style="margin-top:12px;">
          <div class="label">初回のみ：電話番号（ハイフンなし）</div>
          <input id="phoneInput" inputmode="numeric" placeholder="例：08012345678" />
          <div class="hint">未連携の場合のみ表示されます。</div>
        </div>

        <div class="label" style="margin-top:12px;">結果</div>
        <pre id="out">—</pre>
        <div style="height:10px"></div>
      </div>

      <div class="actionBar">
        <button class="btn" id="btnCheckin" disabled>読み込み中…</button>
        <div class="statusLine">
          <div id="statusText">起動中…</div>
          <div class="pill">PENDING 記録</div>
        </div>
      </div>
    </div>
  </div>

  <!-- phone modal -->
  <div id="phoneModal" class="hide" style="
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    padding:18px; background:rgba(0,0,0,.55); backdrop-filter:blur(6px); z-index:9999;">
    <div style="
      width:min(560px,100%);
      border-radius:18px;
      border:1px solid rgba(255,255,255,.12);
      background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.04));
      box-shadow:0 24px 80px rgba(0,0,0,.55);
      padding:16px;">
      <div style="font-size:16px; font-weight:1000; margin-bottom:8px;">会員確認</div>
      <div id="phoneModalMsg" style="font-size:13px; color:rgba(234,240,255,.92); line-height:1.6; white-space:pre-wrap; margin-bottom:10px;">
        電話番号（入会フォームの「緊急連絡先」）を入力してください。
      </div>

      <input id="phoneModalInput" inputmode="numeric" placeholder="例：08012345678" style="
        width:100%;
        padding:14px 14px;
        border-radius:14px;
        border:1px solid rgba(255,255,255,.14);
        background:rgba(255,255,255,.04);
        color:var(--text);
        outline:none;
        font-size:16px;" />

      <div id="phoneModalSelectBox" class="hide" style="margin-top:12px;">
        <div style="font-size:12px; color:rgba(234,240,255,.72); margin-bottom:6px;">
          同じ電話番号の候補が複数あります（選択）
        </div>
        <select id="phoneModalMemberSel" style="
          width:100%;
          padding:14px 14px;
          border-radius:14px;
          border:1px solid rgba(255,255,255,.14);
          background:rgba(255,255,255,.04);
          color:var(--text);
          outline:none;
          font-size:16px;"></select>
        <div style="margin-top:6px; color:rgba(234,240,255,.70); font-size:11px; line-height:1.5;">
          候補を選んだら、もう一度「会員確認して続行」を押してください。
        </div>
      </div>

      <div style="display:grid; gap:10px; margin-top:12px;">
        <button id="phoneModalOk" class="btn" type="button">会員確認して続行</button>
        <button id="phoneModalCancel" type="button" style="
          width:100%;
          border-radius:16px;
          padding:14px 14px;
          font-size:14px;
          font-weight:900;
          border:1px solid rgba(255,255,255,.14);
          background:rgba(255,255,255,.04);
          color:var(--text);">キャンセル</button>
      </div>

      <div id="phoneModalErr" style="margin-top:10px; color:#ff98ad; font-size:12px; white-space:pre-wrap;"></div>
    </div>
  </div>

<script>
  /* ====== 設定（必ず差し替え） ====== */
  const LIFF_ID   = "2008938862-M5N6CXP3";
  const API_URL   = "https://script.google.com/macros/s/AKfycby5I_79Y4b44ldbpM5tUBHtTF1hIOx9e0q1LMnA7K_bPzZ-VeYuDWkLo1nh4eQ82cNs/exec";
  const API_TOKEN = "sol_checkin_2026_144025036146";
  const STAMP_URL = "https://liff.line.me/1654883656-XqwKRkd4/?searchId=849rmjko&shopcardProgramId=01HG80PGE6KDYNYF61RB36SHHD&printablePointId=9cN1kUjyRBqOiexb4KelOfpruP63PRucZ7_BistMav0";
  /* =================================== */

  document.title = "cash_checkin BUILD 2026-02-08_member_resolve_modal_v1";

  const JSONP_TIMEOUT_MS = 16000;

  let gUserId = "";
  let gDisplayName = "";
  let gSelectedRowIndex = 0;
  let RUNNING = false;

  // member_id を保持（URL or resolveで確定したらここに入る）
  let gMemberId = "";

  const $ = (id)=>document.getElementById(id);

  function setOut(obj){
    $("out").textContent = (typeof obj === "string") ? obj : JSON.stringify(obj, null, 2);
  }
  function setStatus(t){ $("statusText").textContent = t || ""; }

  function withTimeout(p, ms, label){
    let t;
    const timeout = new Promise((_, rej)=> t=setTimeout(()=>rej(new Error(label+" timeout")), ms));
    return Promise.race([p, timeout]).finally(()=>clearTimeout(t));
  }

  function jsonp(url){
    return new Promise((resolve, reject)=>{
      const cb = "cb_" + Math.random().toString(36).slice(2);
      const script = document.createElement("script");
      const timer = setTimeout(()=>{
        cleanup();
        reject(new Error("JSONP timeout"));
      }, JSONP_TIMEOUT_MS);

      function cleanup(){
        clearTimeout(timer);
        try { delete window[cb]; } catch(_){}
        script.remove();
      }
      window[cb] = (data)=>{ cleanup(); resolve(data); };

      script.src = url + (url.includes("?") ? "&" : "?") + "callback=" + cb;
      script.onerror = ()=>{ cleanup(); reject(new Error("jsonp load error")); };
      document.body.appendChild(script);
    });
  }

  function yyyymmNowJst(){
    const now = new Date();
    const utc = now.getTime() + now.getTimezoneOffset() * 60000;
    const jst = new Date(utc + 9 * 60 * 60000);
    const y = jst.getFullYear();
    const m = String(jst.getMonth()+1).padStart(2,"0");
    return `${y}${m}`;
  }

  // 電話番号正規化：数字のみ / 10〜11桁想定（雑でOK）
  function normPhone_(s){
    s = String(s || '').trim().replace(/[^\d]/g,'');
    if (s.length < 10) return "";
    if (s.length > 11) return s.slice(-11);
    return s;
  }

  function getQueryParam_(k){
    try{
      const u = new URL(location.href);
      return String(u.searchParams.get(k) || "").trim();
    }catch(e){
      return "";
    }
  }

  function setMemberUiLocked_(){
    $("memberName").textContent = "(未確定)";
    const badge = $("contractBadge");
    badge.innerHTML = '<span class="dot"></span>未確定';
    badge.className = "badge warn";
    $("fee").textContent = "—";
  }

  function applyMeToUi_(me){
    $("memberName").textContent = me.member_name || "(不明)";
    const badge = $("contractBadge");
    badge.innerHTML = '<span class="dot"></span>' + (me.is_contract ? "月謝会員" : "通常会員");
    badge.className = "badge " + (me.is_contract ? "ok" : "ng");
    $("fee").textContent = `¥${Number(me.dropin_fee||0).toLocaleString()}`;
  }

  // ---------- phone modal ----------
  function openPhoneModal_(msg){
    $("phoneModalErr").textContent = "";
    $("phoneModalSelectBox").classList.add("hide");
    $("phoneModalMsg").textContent = msg || "電話番号（入会フォームの「緊急連絡先」）を入力してください。";

    // 互換：既存入力を引き継ぐ
    const cur = $("phoneInput") ? String($("phoneInput").value || "") : "";
    $("phoneModalInput").value = cur;

    $("phoneModal").classList.remove("hide");
    setTimeout(()=>{ try{ $("phoneModalInput").focus(); }catch(_){ } }, 50);
  }

  function closePhoneModal_(){
    $("phoneModal").classList.add("hide");
  }

  function setPhoneModalCandidates_(cands){
    const box = $("phoneModalSelectBox");
    const sel = $("phoneModalMemberSel");
    sel.innerHTML = "";

    (cands || []).forEach((c, i)=>{
      const opt = document.createElement("option");
      opt.value = String(c.rowIndex || "");
      opt.textContent =
        `${c.member_name || "(不明)"}${c.member_type ? " / "+c.member_type : ""}（候補${i+1}）`;
      sel.appendChild(opt);
    });

    gSelectedRowIndex = Number(sel.value || 0);
    sel.onchange = ()=> gSelectedRowIndex = Number(sel.value || 0);

    box.classList.remove("hide");
  }

  // member_id が取れているなら、それで会員情報を取り直す（任意API）
  async function fetchMeByMemberId_(memberId){
    const url = `${API_URL}?api=me_by_member_id&token=${encodeURIComponent(API_TOKEN)}&member_id=${encodeURIComponent(memberId)}`;
    return await jsonp(url);
  }

  // 会員情報を確定させる（優先：member_id、fallback：me_cash）
  async function ensureMemberInfoReady_(){
    setStatus("会員情報を取得中…");

    // A) member_id があるならそれで確定
    if (gMemberId){
      try{
        const r = await fetchMeByMemberId_(gMemberId);
        if (r && r.status === "success"){
          applyMeToUi_(r);
          setStatus("チェックイン可能");
          return true;
        } else {
          setOut({ where:"me_by_member_id", member_id:gMemberId, r });
          // fallthrough
        }
      }catch(e){
        setOut({ where:"me_by_member_id_exception", member_id:gMemberId, error:String(e?.message||e) });
        // fallthrough
      }
    }

    // B) fallback: me_cash（line_user_idで引く）
    const meUrl = `${API_URL}?api=me_cash&token=${encodeURIComponent(API_TOKEN)}&userId=${encodeURIComponent(gUserId)}`;
    let me;
    try{
      me = await jsonp(meUrl);
    }catch(e){
      setOut({ where:"me_cash_exception", meUrl, error:String(e?.message||e) });
      setStatus("失敗");
      return false;
    }

    // need_phone の場合はモーダル強制
    if (me && me.status === "need_phone"){
      setMemberUiLocked_();
      setStatus("電話番号入力が必要");
      openPhoneModal_("会員確認が必要です。電話番号を入力してください。");
      setOut({ where:"me_cash_need_phone", meUrl, me });
      return false;
    }

    if (!me || me.status !== "success"){
      setOut({ where:"me_cash", meUrl, me });
      setStatus("失敗");
      return false;
    }

    // me_cashがmember_idを返せるなら保持
    if (me.member_id) gMemberId = String(me.member_id).trim();

    applyMeToUi_(me);
    setStatus("チェックイン可能");
    return true;
  }

  // ---------- resolve_member modal actions ----------
  $("phoneModalCancel").onclick = ()=> closePhoneModal_();

  $("phoneModalOk").onclick = async ()=>{
    const phone = normPhone_($("phoneModalInput").value);
    if (!phone){
      $("phoneModalErr").textContent = "電話番号を入力してください（ハイフンなし）";
      return;
    }

    $("phoneModalErr").textContent = "";
    $("phoneModalOk").disabled = true;

    const url =
      `${API_URL}?api=resolve_member`
      + `&token=${encodeURIComponent(API_TOKEN)}`
      + `&userId=${encodeURIComponent(gUserId)}`
      + `&phone=${encodeURIComponent(phone)}`
      + (gSelectedRowIndex ? `&rowIndex=${encodeURIComponent(String(gSelectedRowIndex))}` : "");

    try{
      const r = await jsonp(url);

      if (r && r.status === "need_member_select"){
        setPhoneModalCandidates_(r.candidates || []);
        $("phoneModalErr").textContent = "候補を選んで、もう一度「会員確認して続行」を押してください。";
        setOut({ where:"resolve_member_need_select", url, r });
        return;
      }

      if (r && r.status === "success"){
        if (r.member_id) gMemberId = String(r.member_id || "").trim();

        // 互換：画面内inputにも保持（任意）
        if ($("phoneInput")) $("phoneInput").value = phone;

        // 会員情報を取り直してUI確定
        const ok = await ensureMemberInfoReady_();
        if (ok){
          closePhoneModal_();
          $("btnCheckin").disabled = false;
          $("btnCheckin").textContent = "現地精算でチェックイン（PENDING）";
          setStatus("チェックイン可能");
        } else {
          $("phoneModalErr").textContent = "会員情報の取得に失敗しました（サーバ側の応答を確認してください）";
        }
        return;
      }

      $("phoneModalErr").textContent = "照合に失敗しました";
      setOut({ where:"resolve_member_error", url, r });

    } catch(e){
      $("phoneModalErr").textContent = "通信失敗: " + String(e?.message || e);
      setOut({ where:"resolve_member_exception", url, error:String(e?.message || e) });
    } finally {
      $("phoneModalOk").disabled = false;
    }
  };

  async function main(){
    setOut("LIFF init...");
    setStatus("LIFF初期化中…");

    // URLからmember_idを拾う（resolve済みから遷移する設計でも使える）
    gMemberId = getQueryParam_("member_id");

    await withTimeout(liff.init({ liffId: LIFF_ID }), 20000, "liff.init");
    if (!liff.isLoggedIn()) { liff.login(); return; }

    const prof = await withTimeout(liff.getProfile(), 12000, "liff.getProfile");
    gUserId = prof.userId;
    gDisplayName = prof.displayName || "";

    $("yyyymm").textContent = yyyymmNowJst();

    // 1) me（member_id優先 → fallback me_cash）/ need_phoneならモーダル
    const meOk = await ensureMemberInfoReady_();

    // 2) classes
    setOut("classes 読み込み中...");
    setStatus("クラス一覧を取得中…");

    const clsUrl = `${API_URL}?api=classes&token=${encodeURIComponent(API_TOKEN)}`;
    const cls = await jsonp(clsUrl);
    if (!cls || cls.status !== "success") { setOut({ where:"classes", clsUrl, cls }); setStatus("失敗"); return; }

    const sel = $("classSel");
    sel.innerHTML = "";
    (cls.classes || []).forEach(c=>{
      const opt = document.createElement("option");
      opt.value = c.id;
      opt.textContent = c.name;
      sel.appendChild(opt);
    });

    // 3) ready（member未確定ならチェックイン不可のまま）
    $("btnCheckin").disabled = !meOk;
    $("btnCheckin").textContent = meOk ? "現地精算でチェックイン（PENDING）" : "会員確認が必要";

    setOut(meOk ? "準備OK。" : "会員未確定（電話番号入力が必要）");
    setStatus(meOk ? "チェックイン可能" : "会員確認が必要");

    $("btnCheckin").onclick = async ()=>{
      // member_id が無い限り、必ずモーダルを出す（料金ブレ事故防止）
      if (!gMemberId){
        setMemberUiLocked_();
        setStatus("会員確認が必要（電話番号入力）");
        openPhoneModal_("料金を正確に表示するため、会員確認が必要です。電話番号を入力してください。");
        return;
      }

      if (RUNNING) return;
      RUNNING = true;

      $("btnCheckin").disabled = true;
      setStatus("チェックイン送信中…");

      try{
        const classId = sel.value;
        const className = sel.options[sel.selectedIndex]?.textContent || "";

        // （互換）画面内inputを使う場合のために残しておく
        const phone = $("phoneInput") ? normPhone_($("phoneInput").value) : "";

        const url =
          `${API_URL}?api=checkin`
          + `&token=${encodeURIComponent(API_TOKEN)}`
          + `&cash=1`
          + `&member_id=${encodeURIComponent(gMemberId)}`
          + `&userId=${encodeURIComponent(gUserId)}`
          + `&displayName=${encodeURIComponent(gDisplayName)}`
          + `&classId=${encodeURIComponent(classId)}`
          + `&className=${encodeURIComponent(className)}`
          + (phone ? `&phone=${encodeURIComponent(phone)}` : "")
          + (gSelectedRowIndex ? `&rowIndex=${encodeURIComponent(String(gSelectedRowIndex))}` : "");

        const res = await jsonp(url);
        setOut(res);

        if (res && res.status === "need_phone") {
          setStatus("電話番号入力が必要");
          openPhoneModal_("会員確認が必要です。電話番号を入力してください。");
          return;
        }

        if (res && res.status === "need_member_select") {
          // 旧仕様互換（サーバがcheckinで候補返す場合）
          setStatus("候補選択が必要");
          setPhoneModalCandidates_(res.candidates || []);
          openPhoneModal_("同じ電話番号の候補が複数あります。候補を選択してください。");
          return;
        }

        if (res && res.status === "success") {
          // サーバがmember_idを返すなら保持
          if (res.member_id) gMemberId = String(res.member_id).trim();

          const lines = [];
          if (res.pending === true) lines.push(res.pending_message || "本日は現地精算です。受付でお手続きください。");
          if (res.over_limit === true && res.over_message) lines.push(res.over_message);
          else if (res.month_count) lines.push(`今月の受講は ${res.month_count} 回目です。`);
          if (lines.length === 0) lines.push("チェックインが完了しました。");

          const text = lines.join("\n\n") + "\n\nOKでスタンプ付与へ移動します。";
          setStatus("確認待ち");

          const ok = confirm(text);
          if (ok) {
            setStatus("スタンプへ移動中…");
            try { liff.openWindow({ url: STAMP_URL, external: false }); }
            catch(e1){
              try { liff.openWindow({ url: STAMP_URL, external: true }); }
              catch(e2){ window.location.href = STAMP_URL; }
            }
          } else {
            setStatus("キャンセル");
          }
          return;
        }

        setStatus("エラー");
      } catch(e){
        setOut(String(e && e.message ? e.message : e));
        setStatus("通信失敗");
      } finally {
        RUNNING = false;
        $("btnCheckin").disabled = false;
      }
    };
  }

  main().catch(e=>{
    setOut("FATAL: " + String(e && e.message ? e.message : e));
    setStatus("起動失敗");
  });
</script>
</body>
</html>
