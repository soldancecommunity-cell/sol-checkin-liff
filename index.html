<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SoL チェックイン</title>

  <!-- LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial;
      background: #f7f7f9;
      margin: 0;
      padding: 16px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      max-width: 420px;
      margin: 0 auto;
      box-shadow: 0 8px 24px rgba(0,0,0,.06);
    }

    h2 {
      text-align: center;
      margin: 0 0 12px;
    }

    .muted {
      text-align: center;
      font-size: 12px;
      color: #777;
      margin-bottom: 16px;
    }

    label {
      font-size: 14px;
      display: block;
      margin-bottom: 6px;
    }

    select, input {
      width: 100%;
      font-size: 16px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      margin-bottom: 12px;
    }

    button {
      width: 100%;
      font-size: 16px;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: #111;
      color: #fff;
      cursor: pointer;
    }

    button:disabled {
      background: #aaa;
    }

    .hidden {
      display: none;
    }

    .success {
      text-align: center;
      font-size: 16px;
      color: #0a7a2f;
    }

    .spinner {
      text-align: center;
      padding: 20px;
      color: #666;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>SoL チェックイン</h2>
    <div class="muted">LINEアプリ内で開いてください</div>

    <div id="loading" class="spinner">読み込み中…</div>

    <div id="form" class="hidden">
      <label>受講クラス</label>
      <select id="classSelect">
        <option value="">-- 選択してください --</option>
      </select>

      <div id="phoneWrap" class="hidden">
        <label>電話番号（初回のみ・ハイフンなし）</label>
        <input id="phoneInput" type="tel" inputmode="numeric" placeholder="090xxxxxxxx" />
      </div>

      <button id="checkinBtn" onclick="checkin()">チェックイン</button>
    </div>

    <div id="result" class="hidden"></div>
  </div>

<script>
  /* ===== 設定 ===== */
  const LIFF_ID = "2008938862-AlepUDEH";
  const API_URL = "https://script.google.com/macros/s/AKfycbzSfWcEmD_YQERkH5BlP4l91aSomP0HotcymETyItiWhnAk22fc2nxE9QdV0oL2i4Lp/exec";
  const API_TOKEN = "sol_checkin_2026_144025036146";

  const SHOP_CARD_URL = "https://liff.line.me/1654883656-XqwKRkd4/?searchId=849rmjko&shopcardProgramId=01HG80PGE6KDYNYF61RB36SHHD&printablePointId=9cN1kUjyRBqOiexb4KelOfpruP63PRucZ7_BistMav0";
  const REDIRECT_DELAY = 2500;
  /* ================= */

  let LINE_USER_ID = "";
  let LINE_DISPLAY_NAME = "";

  function $(id){ return document.getElementById(id); }

  async function jsonp(url){
    return new Promise((resolve, reject) => {
      const cb = "cb_" + Math.random().toString(36).slice(2);
      window[cb] = data => {
        delete window[cb];
        script.remove();
        resolve(data);
      };
      const script = document.createElement("script");
      script.src = url + "&callback=" + cb;
      script.onerror = () => reject();
      document.body.appendChild(script);
    });
  }

  async function init(){
    await liff.init({ liffId: LIFF_ID });

    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }

    const profile = await liff.getProfile();
    LINE_USER_ID = profile.userId;
    LINE_DISPLAY_NAME = profile.displayName || "";

    const clsRes = await jsonp(
      `${API_URL}?api=classes&token=${API_TOKEN}`
    );

    clsRes.classes.forEach(c => {
      const o = document.createElement("option");
      o.value = c.id;
      o.textContent = c.name;
      $("classSelect").appendChild(o);
    });

    $("loading").classList.add("hidden");
    $("form").classList.remove("hidden");
  }

  async function checkin(){
    const classId = $("classSelect").value;
    if (!classId) return alert("クラスを選択してください");

    const phone = $("phoneInput").value.replace(/[^\d]/g,"");

    $("checkinBtn").disabled = true;

    const url =
      `${API_URL}?api=checkin` +
      `&token=${API_TOKEN}` +
      `&userId=${encodeURIComponent(LINE_USER_ID)}` +
      `&displayName=${encodeURIComponent(LINE_DISPLAY_NAME)}` +
      `&classId=${encodeURIComponent(classId)}` +
      `&className=${encodeURIComponent($("classSelect").selectedOptions[0].text)}` +
      (phone ? `&phone=${phone}` : "");

    const res = await jsonp(url);

    if (res.status === "need_phone") {
      $("phoneWrap").classList.remove("hidden");
      $("checkinBtn").disabled = false;
      return;
    }

    if (res.status !== "success") {
      alert(res.message || "エラーが発生しました");
      $("checkinBtn").disabled = false;
      return;
    }

    $("form").classList.add("hidden");
    $("result").classList.remove("hidden");
    $("result").innerHTML = `<div class="success">チェックイン完了！<br>ショップカードを開きます…</div>`;

    setTimeout(() => {
      try {
        liff.openWindow({ url: SHOP_CARD_URL, external: false });
      } catch(e) {
        window.location.href = SHOP_CARD_URL;
      }
    }, REDIRECT_DELAY);
  }

  init().catch(() => {
    $("loading").textContent = "初期化に失敗しました";
  });
</script>
</body>
</html>
