<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>SoL 受講手続き</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    :root{
      --bg0:#06070a; --bg1:#0b0d12;
      --card: rgba(255,255,255,.06); --card2: rgba(255,255,255,.035);
      --line: rgba(255,255,255,.10);
      --text:#eaf0ff; --muted:#a9b4d0;
      --accent:#7c5cff; --accent2:#2dd4bf;
      --danger:#ff4d6d; --ok:#22c55e;
      --radius: 18px; --shadow: 0 24px 80px rgba(0,0,0,.55);
    }
    *{ box-sizing:border-box; }
    body{
      margin:0; min-height:100vh; color:var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background:
        radial-gradient(1200px 700px at 10% -10%, rgba(124,92,255,.38), transparent 55%),
        radial-gradient(900px 600px at 90% 0%, rgba(45,212,191,.20), transparent 55%),
        radial-gradient(700px 500px at 50% 110%, rgba(124,92,255,.16), transparent 60%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      padding: calc(14px + env(safe-area-inset-top)) 14px calc(22px + env(safe-area-inset-bottom));
      display:flex; justify-content:center; align-items:flex-start;
    }
    .wrap{ width: min(520px, 100%); }

    .brand{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin: 4px 2px 12px; }
    .brandLeft{ display:flex; align-items:center; gap:10px; min-width:0; }
    .logo{
      width:42px; height:42px; border-radius:14px; overflow:hidden; flex:0 0 auto;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--line);
      box-shadow: 0 12px 28px rgba(0,0,0,.25);
      display:flex; align-items:center; justify-content:center;
    }
    .logo img{ width:100%; height:100%; object-fit:cover; display:block; }
    .brandText{ min-width:0; }
    .brandText .title{ margin:0; font-size:18px; font-weight:900; letter-spacing:.2px; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .brandText .subtitle{ margin:2px 0 0; font-size:12px; color:rgba(169,180,208,.85); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .pill{ font-size:12px; color:var(--muted); border:1px solid var(--line); padding:7px 10px; border-radius:999px; background: rgba(255,255,255,.03); }

    .card{ background: linear-gradient(180deg, var(--card), var(--card2)); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; }
    .cardHeader{ padding:18px 18px 14px; border-bottom:1px solid var(--line); background: rgba(255,255,255,.02); }
    .cardHeader h2{ margin:0 0 6px; font-size:20px; font-weight:900; letter-spacing:.2px; }
    .cardHeader p{ margin:0; font-size:12px; color:rgba(169,180,208,.92); line-height:1.55; }
    .content{ padding:16px 18px 18px; }

    .banner{
      display:none; border: 1px solid var(--line); background: rgba(255,255,255,.03);
      padding: 12px 12px; border-radius: 14px; margin-bottom: 12px;
      font-size: 13px; line-height: 1.45;
    }
    .banner.show{ display:block; }
    .banner.danger{ border-color: rgba(255,77,109,.38); background: rgba(255,77,109,.10); color:#ffd3dc; }
    .banner.info{ border-color: rgba(169,180,208,.26); background: rgba(169,180,208,.08); color: rgba(234,240,255,.92); }

    .hintBanner{
      display:none; margin-bottom:12px; border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.04); padding:10px 12px; border-radius:14px;
      font-size:12px; color:rgba(169,180,208,.95); line-height:1.5;
    }
    .hintBanner.show{ display:block; }

    label{ display:block; font-size:12px; color:rgba(169,180,208,.95); margin: 10px 2px 6px; }

    .grid{ display:grid; grid-template-columns: 1fr; gap:10px; margin-top:8px; }
    @media (min-width: 420px){ .grid{ grid-template-columns: 1fr 1fr; } }

    /* ★ 対象会員表示 */
    .memberTarget{
      display:flex; align-items:center; flex-wrap:wrap; gap:8px;
      padding:10px 12px;
      border:1px solid rgba(255,255,255,.08);
      border-radius:12px;
      background:rgba(255,255,255,.03);
      margin-bottom:12px;
    }
    .memberTargetLabel{
      font-size:11px; color:var(--muted); white-space:nowrap;
    }
    .memberTargetName{
      font-size:14px; font-weight:700; flex:1; min-width:0;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .switchMemberBtn{
      -webkit-appearance:none; appearance:none;
      border:1px solid rgba(255,255,255,.18);
      border-radius:20px;
      background:rgba(255,255,255,.05);
      color:var(--muted);
      font-size:12px; padding:6px 14px;
      cursor:pointer; white-space:nowrap;
      transition: background .2s, color .2s;
    }
    .switchMemberBtn:active{ background:rgba(255,255,255,.12); color:var(--text); }

    .lookupMemberBtn{
      width:100%; margin-top:10px;
      -webkit-appearance:none; appearance:none;
      border:1px solid rgba(124,92,255,.55);
      border-radius:14px;
      background:rgba(124,92,255,.12);
      color:var(--text);
      font-size:14px; font-weight:700;
      padding:12px;
      cursor:pointer;
      transition: background .15s, border-color .15s;
    }
    .lookupMemberBtn:active{ background:rgba(124,92,255,.25); }
    .lookupMemberBtn:disabled{ opacity:.5; cursor:not-allowed; }

    .sectionTag{
      margin-top: 12px;
      padding-top: 8px;
      border-top: 1px solid rgba(255,255,255,.08);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
    }
    .sectionTag .left{
      font-size: 12px;
      color: rgba(169,180,208,.92);
    }
    .sectionTag .right{
      font-size: 12px;
      color: rgba(169,180,208,.72);
    }

    .classCard{
      border:1px solid var(--line);
      background: rgba(255,255,255,.03);
      border-radius:16px;
      padding:12px;
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      cursor:pointer; user-select:none;
      transition: transform .08s ease, border-color .15s ease, background .15s ease, opacity .15s ease;
      position: relative;
      overflow: hidden;
    }
    .classCard:active{ transform: translateY(1px); }
    .className{ font-size:15px; font-weight:800; letter-spacing:.1px; line-height:1.2; }
    .classMeta{ font-size:12px; color:rgba(169,180,208,.85); margin-top:2px; }

    .rightWrap{
      display:flex;
      align-items:center;
      gap:8px;
      flex:0 0 auto;
      min-width: fit-content;
    }

    .dot{
      width:10px; height:10px; border-radius:999px;
      border:1px solid rgba(255,255,255,.22); background: rgba(255,255,255,.06);
      flex:0 0 auto;
    }

    .classCard.selected{
      border-color: rgba(124,92,255,.55);
      background: linear-gradient(135deg, rgba(124,92,255,.22), rgba(45,212,191,.12));
      box-shadow: 0 12px 30px rgba(124,92,255,.10);
    }
    .classCard.selected .dot{ background: linear-gradient(135deg, var(--accent), var(--accent2)); border-color: rgba(255,255,255,.22); }

    .classCard.today{
      border-color: rgba(45,212,191,.55);
      background: linear-gradient(135deg, rgba(45,212,191,.14), rgba(124,92,255,.12));
      box-shadow: 0 14px 36px rgba(45,212,191,.12);
    }
    .classCard.today::before{
      content:"";
      position:absolute; inset:-1px;
      background: linear-gradient(135deg, rgba(45,212,191,.55), rgba(124,92,255,.55));
      opacity:.22;
      pointer-events:none;
      border-radius:16px;
      mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      padding:1px;
      -webkit-mask-composite: xor;
      mask-composite: exclude;
    }
    .classCard.today .dot{
      background: rgba(45,212,191,.22);
      border-color: rgba(45,212,191,.38);
    }

    .todayBadge{
      font-size:11px;
      font-weight:900;
      padding:5px 8px;
      border-radius:999px;
      color:#0b0d12;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      box-shadow: 0 10px 24px rgba(124,92,255,.14);
      line-height: 1;
      white-space: nowrap;
    }

    .doneBadge{
      font-size:11px;
      font-weight:900;
      padding:5px 8px;
      border-radius:999px;
      color:#0b0d12;
      background: rgba(34,197,94,.95);
      box-shadow: 0 10px 24px rgba(34,197,94,.16);
      line-height: 1;
      white-space: nowrap;
    }

    .classCard.done{
      opacity: .55;
      cursor: not-allowed;
      transform: none !important;
      border-color: rgba(34,197,94,.30);
      background: rgba(255,255,255,.02);
      box-shadow: none;
    }
    .classCard.done::before{ display:none; }
    .classCard.done .dot{
      background: rgba(34,197,94,.20);
      border-color: rgba(34,197,94,.30);
    }

    .field{
      background: rgba(255,255,255,.03);
      border:1px solid var(--line);
      border-radius:14px;
      padding:12px;
      display:flex; align-items:center; gap:10px;
      margin-top:8px;
    }
    .field input{
      width:100%; border:0; outline:none; background:transparent;
      color:var(--text); font-size:16px;
    }
    .field input::placeholder{ color: rgba(169,180,208,.65); }
    .hint{ font-size:12px; color:rgba(169,180,208,.80); margin-top:6px; }

    .btn{
      width:100%; margin-top:14px; border:0; border-radius:16px; padding:14px;
      font-size:16px; font-weight:900; color:#0b0d12; cursor:pointer;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 14px 40px rgba(124,92,255,.22);
      transition: transform .08s ease, opacity .15s ease;
    }
    .btn:active{ transform: translateY(1px); }
    .btn:disabled{ opacity:.55; cursor:not-allowed; }

    .metaRow{ display:flex; gap:10px; align-items:center; justify-content:space-between; margin-top:12px; }
    .mini{ font-size:12px; color:rgba(169,180,208,.78); max-width:70%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    .miniLoad{
      display:flex; align-items:center; gap:8px;
      font-size:12px; color:rgba(169,180,208,.85);
      margin: 10px 2px 0;
    }
    .miniSpin{
      width:14px; height:14px; border-radius:50%;
      border:2px solid rgba(255,255,255,.18);
      border-top-color: rgba(255,255,255,.8);
      animation: spin .85s linear infinite;
    }
    @keyframes spin{ to{ transform: rotate(360deg); } }

    .successView{ display:none; text-align:center; padding: 18px 18px 20px; }
    .successView.show{ display:block; }
    .check{
      width:58px; height:58px; margin:4px auto 10px; border-radius:18px;
      background: rgba(34,197,94,.14); border:1px solid rgba(34,197,94,.25);
      display:flex; align-items:center; justify-content:center;
      color:#b9ffd4; font-size:30px; font-weight:900;
    }
    .successView h3{ margin:6px 0 6px; font-size:18px; letter-spacing:.2px; font-weight:900; }
    .successView p{ margin:0; color:rgba(169,180,208,.92); font-size:13px; line-height:1.55; }
    .countdown{ margin-top:10px; font-size:12px; color:rgba(169,180,208,.85); }

    .footer{ text-align:center; margin-top:12px; font-size:12px; color:rgba(169,180,208,.72); }

@media (prefers-reduced-motion: reduce){
  *{ animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

.wrap{
  animation: pageIn .28s ease-out both;
}
@keyframes pageIn{
  from{ opacity:0; transform: translateY(8px); }
  to{ opacity:1; transform: translateY(0); }
}

.classCard{
  will-change: transform;
}
.classCard:active{
  transform: translateY(1px) scale(.995);
}

.classCard.today .todayBadge{
  animation: pulseSoft 1.8s ease-in-out infinite;
  transform-origin: 30% 50%;
}
@keyframes pulseSoft{
  0%,100%{ transform: translateZ(0) scale(1); filter: saturate(1); }
  50%{ transform: translateZ(0) scale(1.04); filter: saturate(1.15); }
}

.classCard.selected{
  animation: selectFade .16s ease-out;
}
@keyframes selectFade{
  from{ opacity:.86; }
  to{ opacity:1; }
}

.banner.show{
  animation: bannerIn .18s ease-out both;
}
@keyframes bannerIn{
  from{ opacity:0; transform: translateY(-6px); }
  to{ opacity:1; transform: translateY(0); }
}

.successView.show .check{
  animation: checkIn .22s ease-out both;
}
@keyframes checkIn{
  from{ opacity:0; transform: scale(.92); }
  to{ opacity:1; transform: scale(1); }
}

/* ===== selected を最優先で見せる（todayより勝たせる） ===== */
.classCard.selected{
  border-color: rgba(124,92,255,.78);
  box-shadow: 0 16px 44px rgba(124,92,255,.18);
  transform: translateY(-1px)scale(1.01);
}
.classCard.selected .dot{
  background: linear-gradient(135deg, var(--accent), var(--accent2)) !important;
  border-color: rgba(255,255,255,.35) !important;
  box-shadow:
    0 0 0 4px rgba(124,92,255,.18),
    0 10px 26px rgba(124,92,255,.22);
}
.classCard.today.selected{
  border-color: rgba(45,212,191,.78);
  box-shadow: 0 18px 50px rgba(45,212,191,.14);
}
.classCard.today.selected .dot{
  box-shadow:
    0 0 0 4px rgba(45,212,191,.16),
    0 10px 26px rgba(45,212,191,.20);
}
.classCard.done.selected{
  transform: none;
  box-shadow: none;
}
.classCard.done.selected .dot{
  background: rgba(34,197,94,.20) !important;
  border-color: rgba(34,197,94,.30) !important;
  box-shadow: none;
}

/* ===== Dev Reset (開発用) ===== */
.devReset{
  margin: 10px auto 0;
  display:block;
  width: 100%;
  max-width: 520px;
  border: 1px solid rgba(255,255,255,.14);
  background: rgba(255,255,255,.03);
  color: rgba(234,240,255,.88);
  padding: 10px 12px;
  border-radius: 14px;
  font-size: 12px;
  font-weight: 800;
  cursor: pointer;
}
.devReset:active{ transform: translateY(1px); }

/* ===== modal (lightweight) ===== */
.modal{
  position: fixed;
  inset: 0;
  display:none;
  align-items:center;
  justify-content:center;
  padding: 18px;
  background: rgba(0,0,0,.55);
  backdrop-filter: blur(6px);
  z-index: 9999;
}
.modal.show{ display:flex; }

.modalCard{
  width: min(520px, 100%);
  border-radius: 18px;
  border:1px solid rgba(255,255,255,.12);
  background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.04));
  box-shadow: 0 24px 80px rgba(0,0,0,.55);
  padding: 16px;
}
.modalTitle{
  font-size: 16px;
  font-weight: 900;
  margin-bottom: 8px;
}
.modalText{
  font-size: 13px;
  color: rgba(234,240,255,.92);
  line-height: 1.6;
  margin-bottom: 12px;
  white-space: pre-wrap;
}
.modalBtn{
  width: 100%;
  border: 0;
  border-radius: 14px;
  padding: 12px 14px;
  font-size: 15px;
  font-weight: 900;
  color: #0b0d12;
  cursor: pointer;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
}
  
    /* ★★ SoLローディングオーバーレイ */
    .solOverlay{
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      background: rgba(6,7,10,0.82);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      opacity: 0; pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .solOverlay.active{ opacity: 1; pointer-events: all; }
    .solOverlay-logo{
      font-family: system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
      font-size: 38px; font-weight: 900; letter-spacing: .08em;
      background: linear-gradient(135deg,#a78bfa 0%,#2dd4bf 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .solOverlay-spinner{ position:relative; width:52px; height:52px; }
    .solOverlay-ring{
      position:absolute; inset:0; border-radius:50%;
      border:3px solid transparent;
      animation: solSpin 1.2s cubic-bezier(0.4,0,0.2,1) infinite;
    }
    .solOverlay-ring:nth-child(1){ border-top-color:#7c5cff; animation-delay:0s; }
    .solOverlay-ring:nth-child(2){ border-right-color:#2dd4bf; animation-delay:-0.4s; inset:6px; }
    .solOverlay-ring:nth-child(3){ border-bottom-color:rgba(124,92,255,0.4); animation-delay:-0.8s; inset:12px; }
    @keyframes solSpin{ to{ transform:rotate(360deg); } }
    .solOverlay-label{
      font-size:13px; color:rgba(255,255,255,0.55); letter-spacing:.1em;
      animation: solPulse 1.6s ease-in-out infinite;
    }
    @keyframes solPulse{ 0%,100%{opacity:0.4} 50%{opacity:1} }
  </style>
</head>

<body>

    <div id="solOverlay" class="solOverlay" aria-live="polite">
      <div class="solOverlay-logo">SoL</div>
      <div class="solOverlay-spinner">
        <div class="solOverlay-ring"></div>
        <div class="solOverlay-ring"></div>
        <div class="solOverlay-ring"></div>
      </div>
      <div class="solOverlay-label">読み込み中</div>
    </div>

  <div class="wrap">
    <div class="brand">
      <div class="brandLeft">
        <div class="logo"><img src="./logo.png" alt="SoL logo" /></div>
        <div class="brandText">
          <p class="title">Lesson Check-in</p>
          <p class="subtitle">SoL Dance Community</p>
        </div>
      </div>
      <div class="pill">Check-in</div>
    </div>

    <div class="card">
      <div class="cardHeader">
        <h2>チェックイン</h2>
        <p>受講クラスを選んでチェックイン。<br>初回のみ電話番号（ハイフンなし）で会員連携します。</p>
      </div>

      <div class="content">
        <div id="externalHint" class="hintBanner">
          外部ブラウザから開かれています。LINEアプリ内で開くとスムーズにチェックインできます。
        </div>

        <div id="banner" class="banner"></div>

        <div id="miniLoading" class="miniLoad" style="display:none;">
          <div class="miniSpin"></div>
          <div id="miniLoadingText">同期中…</div>
        </div>

        <div id="formBox" style="display:none;">

          <!-- ★ 対象会員表示 -->
          <div id="memberTargetRow" class="memberTarget" style="display:none;">
            <div class="memberTargetLabel">対象</div>
            <div id="memberTargetName" class="memberTargetName">—</div>
            <button id="switchMemberBtn" class="switchMemberBtn" onclick="switchMember()" style="display:none;">別の会員としてチェックイン</button>
          </div>

          <div class="sectionTag">
            <div class="left" id="todayLabel">受講クラス（タップで選択）</div>
            <div class="right" id="todayJst"></div>
          </div>

          <div id="classGrid" class="grid"></div>

          <div id="phoneWrap" style="display:none; margin-top: 14px;">
            <label id="phoneLabel">電話番号（初回のみ）</label>
            <div class="field">
              <input id="phoneInput" type="tel" inputmode="numeric" placeholder="090xxxxxxxx"
                     autocomplete="off" autocorrect="off" autocapitalize="off" />
            </div>
            <div class="hint">会員登録時の「緊急連絡先」と一致する必要があります。</div>
            <!-- ★ 別会員モード時のみ表示する会員確認ボタン -->
            <button id="lookupMemberBtn" class="lookupMemberBtn" onclick="lookupMember_()" style="display:none;">
              この番号で会員を確認する
            </button>
          </div>

          <button id="checkinBtn" class="btn" onclick="checkin()" disabled>チェックイン</button>

          <div class="metaRow">
            <div class="mini" id="subInfo"></div>
            <div class="mini" id="netInfo"></div>
          </div>
        </div>

        <!-- Unpaid / Pending modal -->
        <div id="payModal" class="modal">
          <div class="modalCard">
            <div class="modalTitle" id="payModalTitle">お支払いの確認</div>
            <div class="modalText" id="payModalText"></div>
            <button class="modalBtn" id="payModalOk">OK</button>
          </div>
        </div>
        <!-- Link confirm/select modal -->
        <div id="linkModal" class="modal">
          <div class="modalCard">
            <div class="modalTitle" id="linkModalTitle">会員確認</div>
            <div class="modalText" id="linkModalText"></div>
        
            <div id="linkModalList" style="display:none; margin-top:10px;"></div>
        
            <div style="display:flex; gap:10px; margin-top:14px;">
              <button class="modalBtn" id="linkModalCancel">戻る</button>
              <button class="modalBtn" id="linkModalOk">OK</button>
            </div>
          </div>
        </div>

        <div id="successView" class="successView">
          <div class="check">✓</div>
          <h3>チェックイン完了</h3>
          <p id="successMsg">スタンプを付与します…</p>
          <div class="countdown" id="countdown"></div>
        </div>
      </div>
    </div>

    <div class="footer">
      © SoL Dance Community
      <!-- 開発用：長押しで表示 -->
      <button id="devResetBtn" class="devReset" style="display:none;" type="button">
        今日の「済」をリセット（開発用）
      </button>
    </div>

  </div>

<script>

  function showOverlay(){ var e=document.getElementById('solOverlay'); if(e) e.classList.add('active'); }
  function hideOverlay(){ var e=document.getElementById('solOverlay'); if(e) e.classList.remove('active'); }
 

/**

  function jsonp(url){
    return new Promise((resolve, reject) => {
      const cb = "cb_" + Math.random().toString(36).slice(2);
      const script = document.createElement("script");
      const timer = setTimeout(() => {
        cleanup();
        reject(new Error("JSONP timeout"));
      }, JSONP_TIMEOUT_MS);

      function cleanup(){
        clearTimeout(timer);
        window[cb] = function(){}; // no-op（タイムアウト後の遅延レスポンスでReferenceErrorが出るのを防ぐ）
        if (script && script.parentNode) script.parentNode.removeChild(script);
      }

      window[cb] = (data) => { cleanup(); resolve(data); };

      const sep = url.includes("?") ? "&" : "?";
      script.src = url + sep + "callback=" + cb;
      script.onerror = () => { cleanup(); reject(new Error("JSONP load error")); };
      document.body.appendChild(script);
    });
  }
    // ==========================================================
    // ★B案：連携コードを発行して、ユーザー本人に送信（webhookで送信用IDと紐付け）
    //  - GAS側に api=issue_link_code が存在する前提
    //  - 成功すると { status:"success", code:"123456", expires_at:"..." } 等が返る想定
    // ==========================================================
    async function issueLinkCodeAndSend_(phone){
      phone = normalizePhone(phone);
      if (!phone) return { ok:false, reason:'no_phone' };
  
      // 連携コードの多重送信を防止（端末単位）
      const key = `sol_linkcode_sent_${phone}`;
      if (localStorage.getItem(key) === "1") {
        return { ok:true, skipped:true, reason:'already_sent' };
      }
  
      // LIFF外（ブラウザ）では sendMessages 不可
      if (!liff.isInClient()) {
        return { ok:false, reason:'not_in_client' };
      }
  
      // ★GAS：連携コード発行（phoneでmember_id解決する前提）
      // 必要なら userId も渡す（GAS側で使える）
      const url =
        `${API_URL}?api=issue_link_code` +
        `&token=${encodeURIComponent(API_TOKEN)}` +
        `&phone=${encodeURIComponent(phone)}` +
        `&userId=${encodeURIComponent(LINE_USER_ID)}`;
  
      const r = await jsonp(url);

      // レスポンス無し
      if (!r) {
        return { ok:false, reason:'issue_failed_no_response' };
      }
      
      // 想定フォーマットでない
      if (r.status !== "success" || !r.code) {
        return { ok:false, reason:'issue_failed_bad_response', raw:r };
      }

  
      const code = String(r.code).trim();
  
      // ★ユーザー本人のトークに送信（これが webhook の source.userId を確定させる）
      try {
        await liff.sendMessages([{ type:"text", text:`SoL連携コード:${code}` }]);
      } catch (e) {
        return { ok:false, reason:'sendMessages_failed', error: String(e && e.message ? e.message : e), code };
      }

  
      // 送れたらフラグON
      localStorage.setItem(key, "1");
      return { ok:true, code, expires_at: r.expires_at || "" };
    }

  function formatJstYmdHm_(){

    return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;

  function formatJstYmdCompact_(){
    const d = getJstNow_();
    const pad = (n) => String(n).padStart(2, "0");

  function loadClassesCache(){

      if(!raw) return null;
      const obj = JSON.parse(raw);
      if(!obj || !obj.ts || !Array.isArray(obj.classes)) return null;
      if(Date.now() - obj.ts > CLASSES_CACHE_TTL_MS) return null;
      return obj.classes;

  function sortClassesByToday_(classes){
    const today = TODAY_WD || getJstWeekdayJa_();
    const wdOrder = { "月":0, "火":1, "水":2, "木":3, "金":4, "土":5, "日":6 };

    const orderKey = (c) => {
      const wd = normalizeWeekdayCell_(c.weekday);
      const isToday = (wd && wd === today) ? 0 : 1;
      const dayRank = (wd in wdOrder) ? wdOrder[wd] : 999;
      return { isToday, dayRank, wd };
    };

    return (classes || [])
      .map((c, i) => ({...c, __i:i}))
      .sort((a, b) => {
        const ka = orderKey(a);
        const kb = orderKey(b);

        if (ka.isToday !== kb.isToday) return ka.isToday - kb.isToday;
        if (ka.dayRank !== kb.dayRank) return ka.dayRank - kb.dayRank;

        const an = String(a.name || "");
        const bn = String(b.name || "");
        if (an && bn) {
          const cmp = an.localeCompare(bn, "ja");
          if (cmp !== 0) return cmp;
        } else if (an && !bn) return -1;
        else if (!an && bn) return 1;

        return a.__i - b.__i;
      })
      .map(({__i, ...c}) => c);
  }

  function countTodayClasses_(classes){
    const today = TODAY_WD || getJstWeekdayJa_();
    return (classes || []).filter(c => normalizeWeekdayCell_(c.weekday) === today).length;

  let LOOKUP_IN_FLIGHT = false;
  async function lookupMember_() {
    if (LOOKUP_IN_FLIGHT) return;

    const phone = normalizePhone($("phoneInput").value);
    if (!phone) {
      showBanner("電話番号を入力してください（ハイフンなし）。", "danger");
      return;
    }

    LOOKUP_IN_FLIGHT = true;
    const btn = $("lookupMemberBtn");

    hideBanner();
    showOverlay();

    try {
      const url =
        `${API_URL}?api=resolve_member`
        + `&token=${encodeURIComponent(API_TOKEN)}`
        + `&userId=${encodeURIComponent(LINE_USER_ID)}`
        + `&phone=${encodeURIComponent(phone)}`
        + `&readonly=1`; // ★ 書き込みなしで検索のみ（別会員のLINE IDを汚染しない）

      const r = await jsonp(url);

      if (r && r.status === "need_member_select") {
        openLinkSelect(r.candidates || []);

        return;
      }

      if (r && r.status === "need_link_confirm") {
        openLinkConfirm(r.candidate);
        return;

      if (r && r.status === "success") {
        // 既に紐付け済み → 対象を更新してそのままチェックインへ
        const name = String(r.member_name || "").trim();
        const type = String(r.member_type || "").trim();

        // ★ member_id を保存（GASのLINEユーザーIDフォールバックで別会員が返るのを防ぐ）
        if (r.member_id) {

          return;

        // ★ done状態を新しい会員のキーで再評価してクラス一覧を再描画
        reRenderClassesForCurrentMember_();
        showBanner("会員を確認しました。クラスを選んで「チェックイン」を押してください。", "info");
        $("lookupMemberBtn").style.display = "none";
        return;

      showBanner("会員が見つかりませんでした。電話番号を確認してください。", "danger");

    } catch (err) {
      showBanner("通信に失敗しました。電波の良い場所で再度お試しください。", "danger");
    } finally {
      LOOKUP_IN_FLIGHT = false;
      btn.disabled = false;
      btn.textContent = "この番号で会員を確認する";
      hideOverlay();
    }
  }

  async function init(){
    showOverlay();
    hideBanner();
    applyTodayHeader_();
    wireDevReset_();

    $("netInfo").textContent = navigator.onLine ? "online" : "offline";

    const cached = loadClassesCache();
    if (cached && cached.length){
      $("formBox").style.display = "block";
      const sortedCached = sortClassesByToday_(cached);
      renderClasses(sortedCached, "前回の一覧（同期中）");
      showMiniLoading("最新のクラス一覧を同期中…");

      const todayCountCached = countTodayClasses_(cached);
      if (todayCountCached === 0) {
        showBanner("本日のクラスはありません。次回のクラスから選択できます。", "info");
        $("todayLabel").textContent = `受講クラス（本日のクラスはありません）`;
      }
    }else{
      $("formBox").style.display = "block";
      showMiniLoading("起動中…");
    }

    await liff.init({ liffId: LIFF_ID });

    if (!liff.isInClient()) $("externalHint").classList.add("show");

    if (!liff.isLoggedIn()) {
      hideOverlay();
      liff.login();
      return;
    }

    const profilePromise = liff.getProfile();
    const classesPromise = jsonp(`${API_URL}?api=classes&token=${encodeURIComponent(API_TOKEN)}`);

    const profile = await profilePromise;
    LINE_USER_ID = profile.userId;
    LINE_DISPLAY_NAME = profile.displayName || "";
    $("subInfo").textContent = LINE_DISPLAY_NAME ? `@${LINE_DISPLAY_NAME}` : "";

    // ★ 並列：api=me で既存の会員リンク取得（対象表示用）
    const mePromise = jsonp(`${API_URL}?api=me&userId=${encodeURIComponent(LINE_USER_ID)}&token=${encodeURIComponent(API_TOKEN)}`);

    const clsRes = await classesPromise;
    if (!clsRes || clsRes.status !== "success") {
      throw new Error(clsRes && clsRes.message ? clsRes.message : "classes load failed");
    }

    const classes = clsRes.classes || [];
    const sorted = sortClassesByToday_(classes);
    renderClasses(sorted, "タップして選択");
    saveClassesCache(classes);

    const todayCount = countTodayClasses_(classes);
    if (todayCount === 0) {
      showBanner("本日のクラスはありません。次回のクラスから選択できます。", "info");
      $("todayLabel").textContent = `受講クラス（本日のクラスはありません）`;
    }

    // ★ 追加：force_phone の時は phone入力UIを強制表示
    if (FORCE_PHONE) {
      $("phoneWrap").style.display = "block";
      $("phoneInput").value = "";
      showBanner("開発モード（force_phone=1）：電話番号を入力してチェックインしてください。", "info");
    }

    // ★ 対象会員表示（api=me の結果を受け取る）
    try {
      const meRes = await mePromise;
      if (meRes && meRes.status === "success" && meRes.linked && meRes.member) {
        updateTargetDisplay_(
          String(meRes.member.member_name || "").trim(),
          String(meRes.member.member_type || "").trim()
        );
      }
    } catch(_) {}

    hideMiniLoading();
    hideOverlay();
    $("checkinBtn").disabled = true;
  }

  // ===== checkin (DEBUGなし／重複遷移なし) =====
  // ===== checkin (OKボタン付き表示：未払い/現地精算/回数) =====
async function checkin(isConfirm){
  hideBanner();

  // 1) 必須チェック
  if (!SELECTED_CLASS || !SELECTED_CLASS.id) {
    showBanner("クラスを選択してください。", "danger");
    return;
  }

  if (isDoneToday_(SELECTED_CLASS.id)) {
    showBanner("このクラスは本日すでにチェックイン済みです。", "info");
    $("checkinBtn").disabled = true;
    return;
  }

  // force_phone のときは電話番号必須
  if (FORCE_PHONE) {
    $("phoneWrap").style.display = "block";
    const p = normalizePhone($("phoneInput").value);
    if (!p) {
      showBanner("開発モード：電話番号が未入力です。入力してください。", "info");
      return;
    }
  }

  const phone = normalizePhone($("phoneInput").value);

  setBusy(true);
  showOverlay();
  showMiniLoading("チェックイン送信中…");

  try {
    const url =
      `${API_URL}?api=checkin` +
      `&token=${encodeURIComponent(API_TOKEN)}` +
      `&userId=${encodeURIComponent(LINE_USER_ID)}` +
      `&displayName=${encodeURIComponent(LINE_DISPLAY_NAME)}` +
      `&classId=${encodeURIComponent(SELECTED_CLASS.id)}` +
      `&className=${encodeURIComponent(SELECTED_CLASS.name)}` +
      (phone ? `&phone=${encodeURIComponent(phone)}` : "") +
      // ★ 別会員モード：GASのLINEユーザーIDフォールバックで別会員が返るのを防ぐ
      (SWITCH_MEMBER_ID ? `&member_id=${encodeURIComponent(SWITCH_MEMBER_ID)}` : "") +
      // ★ isConfirmがfalseでもPENDING済みなら confirm=1 を送る（別会員モード対応）
      ((( isConfirm || (PENDING_CONFIRM && PENDING_ROW_INDEX) ) && PENDING_ROW_INDEX) ? `&confirm=1&rowIndex=${encodeURIComponent(PENDING_ROW_INDEX)}` : "");

    // ★ busy / 通信エラー時の自動リトライ（50人同時対応）
    const CHECKIN_MAX_RETRY = 8;
    let res = null;

    for (let attempt = 1; attempt <= CHECKIN_MAX_RETRY; attempt++) {
      if (attempt > 1) {
        showMiniLoading(`再試行中 (${attempt}/${CHECKIN_MAX_RETRY})…`);
      }

      try {
        res = await jsonp(url);
      } catch (netErr) {
        // ★ 通信エラー（タイムアウト等）→ リトライ
        console.error("checkin network error attempt=" + attempt, netErr);
        if (attempt < CHECKIN_MAX_RETRY) {
          const waitMs = Math.min(3000 * attempt, 15000) + Math.floor(Math.random() * 2000);
          showMiniLoading(`通信エラー・${Math.round(waitMs/1000)}秒後に再試行… (${attempt}/${CHECKIN_MAX_RETRY})`);
          await new Promise(r => setTimeout(r, waitMs));
          continue;
        }
        showBanner("通信に失敗しました。電波の良い場所で再度お試しください。", "danger");
        hideOverlay();
        return;
      }

      // ★ busy：サーバーのロック混雑 → 自動リトライ（ユーザー操作不要）
      if (res && res.status === "busy") {
        if (attempt < CHECKIN_MAX_RETRY) {
          const retryAfter = Number(res.retry_after || 3);
          const jitter = Math.floor(Math.random() * 2000);
          const waitMs = retryAfter * 1000 + jitter;
          showMiniLoading(`混み合っています・まもなく再試行… (${attempt}/${CHECKIN_MAX_RETRY})`);
          await new Promise(r => setTimeout(r, waitMs));
          continue;
        }
        showBanner("サーバーが混み合っています。少し待ってから再度お試しください。", "danger");
        hideOverlay();
        return;
      }

      // busy/通信エラー以外のレスポンスが来た → ループを抜けて通常処理へ
      break;
    }

    // 2) 初回電話要求
    if (res && res.status === "need_phone") {
      $("phoneWrap").style.display = "block";
      showBanner("初回のみ、会員登録時の電話番号（ハイフンなし）を入力してください。", "info");
      hideOverlay();
      return;
    }

    // 2.5) 会員選択が必要
    if (res && res.status === "need_member_select") {
      openLinkSelect(res.candidates || []);
      hideOverlay();
      return;
    }
    
    // 2.6) 会員確認（1件ヒット）
    if (res && res.status === "need_link_confirm") {
      openLinkConfirm(res.candidate);
      hideOverlay();
      return;
    }


    // 3) すでにチェックイン済み（サーバー判定）
    if (res && res.status === "already") {
      showBanner(res.message || "本日はすでにチェックイン済みです。", "info");
      markDoneToday_(SELECTED_CLASS.id);
      hideOverlay();
      return;
    }

    // 4) 失敗
    if (!res || res.status !== "success") {
      showBanner("チェックインに失敗しました。受付へお声がけください。", "danger");
      hideOverlay();
      return;
    }

    // 5) 成功（ここで初めて “済” を付ける）
    markDoneToday_(SELECTED_CLASS.id);
    // ★ 別会員モードのPENDINGをリセット
    PENDING_CONFIRM = false;
    PENDING_ROW_INDEX = 0;
    SWITCH_MEMBER_ID = "";
    hideOverlay(); // ★ チェックイン完了でオーバーレイ解除
    // ==========================================================
    // ★B案：初回電話が入っているときだけ、連携コードを送る
    // （webhookが受けて member_line_links を送信用IDで確定させる）
    // ==========================================================
    if (phone) {
      try {
        // UI的に軽く案内（邪魔しない）
        showMiniLoading("LINE連携中…");
        const linkRes = await issueLinkCodeAndSend_(phone);
        if (!linkRes.ok) {
          showBanner("LINE連携の処理中に問題が発生しました。チェックイン自体は完了しています。", "info");
        } else if (linkRes.skipped) {
          // LINE連携スキップ：会員への表示不要のため省略
        } else {
          // LINE連携OK：会員への表示不要（成功時はバナー不要）
        }

        // 送れなかった理由は運用上重要なので、開発モード/必要時のみ出す
        if (!linkRes.ok && FORCE_PHONE) {
          showBanner("LINE通知の送信に失敗しましたが、チェックインは完了しています。", "info");
        }
      } catch (e) {
        // 失敗してもチェックイン自体は成功させる（ここで止めない）
        if (FORCE_PHONE) {
          showBanner("LINE連携でエラーが発生しましたが、チェックインは完了しています。", "info");
        }
      } finally {
        hideMiniLoading();
      }
    }


    const goStamp = () => {
      showSuccess("スタンプを付与します…");
      startCountdown(REDIRECT_DELAY_MS);
      setTimeout(openStamp, REDIRECT_DELAY_MS);
    };

    // 6) 表示メッセージ（優先順位：未払い→現地精算→超過→回数）
    const unpaidMsg  = (res.unpaid === true)
      ? (res.unpaid_message || "当月のお支払いが未確認です。受付でお声がけください。")
      : "";

    const pendingMsg = (res.pending === true)
      ? (res.pending_message || "本日は現地精算です。受付でお手続きください。")
      : "";

    const overMsg = (res.over_limit === true)
      ? (res.over_message || "")
      : "";

    // ★ここは res.over_message を使わない方が安全（回数表示が変になる）
    const monthMsg = (!overMsg && res.month_count)
      ? `今月の受講は ${res.month_count} 回目です。`
      : "";

    // 7) 回数/超過モーダル → OKでスタンプ
    const showInfoThenStamp = () => {
      const infoMsg = overMsg || monthMsg;
      if (infoMsg) {
        showPayModal(
          overMsg ? "追加受講の可能性" : "今月の受講回数",
          infoMsg + "\n\nOKを押すとスタンプ付与へ移動します。",
          () => goStamp()
        );
      } else {
        goStamp();
      }
    };

    // 8) 未払い/現地精算 → OK → 回数/超過 → OK → スタンプ
    if (unpaidMsg) {
      showPayModal(
        "当月のお支払いが未確認です",
        unpaidMsg + "\n\n※チェックインは完了しています。受付でお声がけください。",
        () => showInfoThenStamp()
      );
      return;
    }

    if (pendingMsg) {
      showPayModal(
        "本日は現地精算です",
        pendingMsg + "\n\n※チェックインは完了しています。受付でお手続きください。",
        () => showInfoThenStamp()
      );
      return;
    }

    // 9) 支払い系が無い → 回数/超過だけ（あれば）→ スタンプ
    showInfoThenStamp();

  } catch (err) {
    console.error(err);
    showBanner("通信に失敗しました。電波の良い場所で再度お試しください。", "danger");
  } finally {
    setBusy(false);
    hideMiniLoading();
  }
}




  init().catch(err => {
    hideMiniLoading();
    hideOverlay();
    showBanner("読み込みに失敗しました。ページを閉じてQRコードから再度開いてください。", "danger");
    console.error(err);
  });
</script>
