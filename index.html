<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SoL Check-in</title>

  <!-- LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    :root{
      --bg: #0b0f17;
      --card: rgba(255,255,255,.06);
      --card2: rgba(255,255,255,.085);
      --stroke: rgba(255,255,255,.10);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.60);
      --accent: #7dd3fc;   /* today */
      --ok: #34d399;       /* selected */
      --danger: #fb7185;
      --shadow: 0 12px 30px rgba(0,0,0,.35);
      --radius: 18px;
    }

    html, body { height:100%; }
    body{
      margin:0;
      background: radial-gradient(1200px 900px at 20% 10%, rgba(125,211,252,.10), transparent 55%),
                  radial-gradient(1000px 800px at 80% 30%, rgba(52,211,153,.08), transparent 55%),
                  var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Segoe UI", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* 画面に一切出さない（内部処理は継続） */
    .visually-hidden,
    #hidden-loading,
    #hidden-loading *{
      display:none !important;
      visibility:hidden !important;
      width:0 !important;
      height:0 !important;
      opacity:0 !important;
      pointer-events:none !important;
    }

    .wrap{
      max-width: 520px;
      margin: 0 auto;
      padding: 22px 16px 28px;
    }

    .header{
      display:flex;
      gap:10px;
      align-items:flex-start;
      justify-content:space-between;
      margin-bottom: 14px;
    }

    .brand{
      display:flex;
      flex-direction:column;
      gap:4px;
    }

    .title{
      font-size: 18px;
      font-weight: 700;
      letter-spacing: .02em;
    }
    .subtitle{
      font-size: 12px;
      color: var(--muted);
      line-height: 1.35;
    }

    .pill{
      font-size: 12px;
      color: var(--muted);
      border: 1px solid var(--stroke);
      background: rgba(255,255,255,.04);
      padding: 6px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .notice{
      margin-top: 10px;
      padding: 12px 14px;
      border: 1px solid var(--stroke);
      background: rgba(255,255,255,.045);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .notice .big{
      font-size: 14px;
      font-weight: 700;
      margin: 0 0 4px 0;
    }
    .notice .small{
      font-size: 12px;
      color: var(--muted);
      margin: 0;
      line-height: 1.5;
    }

    .grid{
      margin-top: 14px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .card{
      position: relative;
      border: 1px solid var(--stroke);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.035));
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px 14px 12px;
      cursor: pointer;
      user-select: none;
      transition: transform .12s ease, background .12s ease, border-color .12s ease;
      overflow: hidden;
    }
    .card:active{ transform: scale(.995); }
    .card:hover{ border-color: rgba(255,255,255,.16); }

    /* 今日のカード強調 */
    .card.today{
      border-color: rgba(125,211,252,.35);
      background: linear-gradient(180deg, rgba(125,211,252,.10), rgba(255,255,255,.035));
    }

    /* 今日バッジ：左上（選択ドットと干渉しない） */
    .badge-today{
      position:absolute;
      top: 10px;
      left: 10px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .04em;
      color: rgba(0,0,0,.85);
      background: var(--accent);
      padding: 5px 8px;
      border-radius: 999px;
      box-shadow: 0 8px 18px rgba(0,0,0,.25);
    }

    /* 選択ドット：右上（常に確保） */
    .dot{
      position:absolute;
      top: 12px;
      right: 12px;
      width: 10px;
      height: 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.35);
      background: rgba(255,255,255,.10);
      box-shadow: 0 8px 18px rgba(0,0,0,.25);
    }
    .card.selected .dot{
      border-color: rgba(52,211,153,.6);
      background: var(--ok);
    }

    .row1{
      display:flex;
      flex-direction:column;
      gap: 6px;
      padding-top: 10px; /* 左上の今日バッジと行間を確保 */
    }

    .name{
      font-size: 15px;
      font-weight: 800;
      letter-spacing: .01em;
      line-height: 1.3;
      padding-right: 24px; /* 右上ドット分 */
    }

    .meta{
      display:flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
    }

    .chip{
      border: 1px solid var(--stroke);
      background: rgba(255,255,255,.04);
      padding: 5px 8px;
      border-radius: 999px;
      color: rgba(255,255,255,.75);
    }

    .footer{
      margin-top: 14px;
      font-size: 11px;
      color: rgba(255,255,255,.45);
      line-height: 1.5;
    }

    .err{
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: var(--radius);
      border: 1px solid rgba(251,113,133,.35);
      background: rgba(251,113,133,.10);
      color: rgba(255,255,255,.92);
      display:none;
    }

    .ok{
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: var(--radius);
      border: 1px solid rgba(52,211,153,.35);
      background: rgba(52,211,153,.10);
      color: rgba(255,255,255,.92);
      display:none;
    }

    .center{
      text-align:center;
    }

    .btn{
      margin-top: 10px;
      width: 100%;
      border: 1px solid rgba(255,255,255,.15);
      background: rgba(255,255,255,.06);
      color: rgba(255,255,255,.90);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .12s ease, background .12s ease, border-color .12s ease;
    }
    .btn:active{ transform: scale(.995); }
    .btn[disabled]{
      opacity: .45;
      cursor: not-allowed;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="header">
      <div class="brand">
        <div class="title">SoL 出席チェックイン</div>
        <div class="subtitle">クラスを選択すると、出席が記録されます。</div>
      </div>
      <div class="pill" id="today-pill">—</div>
    </div>

    <div class="notice">
      <p class="big">本日のクラス</p>
      <p class="small">上から順に「今日の曜日 → 月→火→水→木→金→土→日」で固定表示します。</p>
    </div>

    <div id="error" class="err"></div>
    <div id="success" class="ok"></div>

    <div id="grid" class="grid"></div>

    <button id="reload" class="btn" type="button">再読み込み</button>

    <div class="footer center">
      ※ チェックイン完了後、自動でショップカードへ遷移します（約2.5秒）
    </div>
  </div>

  <!-- 画面に一切出さないロード要素（内部処理は継続） -->
  <div id="hidden-loading" class="visually-hidden" aria-hidden="true">
    <div id="status">起動中…</div>
    <div id="spinner">⏳</div>
  </div>

  <script>
    /******************************************************************
     * 設定：あなたの環境に合わせてここだけ確認
     ******************************************************************/
    const LIFF_ID = "2008938862-AlepUDEH"; // ← 既存のLIFF IDに置き換え
    const GAS_ENDPOINT = "https://script.google.com/macros/s/AKfycbzSfWcEmD_YQERkH5BlP4l91aSomP0HotcymETyItiWhnAk22fc2nxE9QdV0oL2i4Lp/exec"; // ← https://script.google.com/macros/s/.../exec
    const SHOP_CARD_URL = "https://liff.line.me/1654883656-XqwKRkd4/?searchId=849rmjko&shopcardProgramId=01HG80PGE6KDYNYF61RB36SHHD&printablePointId=9cN1kUjyRBqOiexb4KelOfpruP63PRucZ7_BistMav0"; // ← スタンプ付与URL（チェックイン後に遷移）

    // JSONP callback 名（GAS側の仕様に合わせる）
    const JSONP_CALLBACK_CLASSES = "cb_classes";
    const JSONP_CALLBACK_CHECKIN = "cb_checkin";

    /******************************************************************
     * 内部状態
     ******************************************************************/
    const WEEKDAY_ORDER = ["月","火","水","木","金","土","日"];
    let lineUserId = "";
    let classes = [];
    let selectedClassId = "";

    const elGrid = document.getElementById("grid");
    const elErr = document.getElementById("error");
    const elOk = document.getElementById("success");
    const elTodayPill = document.getElementById("today-pill");
    const elReload = document.getElementById("reload");

    // 表示はしないが、内部処理では使う（要求仕様）
    function setStatus_(_text){ /* no-op (UI非表示) */ }

    function showError_(msg){
      elOk.style.display = "none";
      elErr.textContent = msg || "エラーが発生しました。";
      elErr.style.display = "block";
    }
    function showSuccess_(msg){
      elErr.style.display = "none";
      elOk.textContent = msg || "チェックイン完了";
      elOk.style.display = "block";
    }
    function clearMessages_(){
      elErr.style.display = "none";
      elOk.style.display = "none";
      elErr.textContent = "";
      elOk.textContent = "";
    }

    /******************************************************************
     * 1) クラス並び順：
     *   - 今日の曜日を最優先
     *   - その他は 月→火→水→木→金→土→日 の固定
     ******************************************************************/
    function getTodayJp_(){
      // JS: 0=日,1=月,...6=土 → 日本語に変換
      const d = new Date();
      const map = ["日","月","火","水","木","金","土"];
      return map[d.getDay()];
    }

    function sortClasses_(arr){
      const today = getTodayJp_();
      const idx = (w) => {
        const i = WEEKDAY_ORDER.indexOf(String(w || "").trim());
        return (i === -1) ? 99 : i;
      };

      return [...arr].sort((a,b) => {
        const aToday = String(a.weekday) === today ? 0 : 1; // 0が先
        const bToday = String(b.weekday) === today ? 0 : 1;
        if (aToday !== bToday) return aToday - bToday;

        const ai = idx(a.weekday);
        const bi = idx(b.weekday);
        if (ai !== bi) return ai - bi;

        // 同曜日内の安定並び（任意）：class_name → instructor → class_id
        const an = String(a.class_name || "");
        const bn = String(b.class_name || "");
        if (an !== bn) return an.localeCompare(bn, "ja");

        const ains = String(a.instructor || "");
        const bins = String(b.instructor || "");
        if (ains !== bins) return ains.localeCompare(bins, "ja");

        return String(a.class_id || "").localeCompare(String(b.class_id || ""), "ja");
      });
    }

    /******************************************************************
     * 2) UI描画（今日バッジ：左上、選択ドット：右上）
     ******************************************************************/
    function renderClasses_(){
      elGrid.innerHTML = "";
      clearMessages_();

      const today = getTodayJp_();
      elTodayPill.textContent = "今日：" + today;

      if (!classes || !classes.length){
        showError_("本日の表示対象クラスがありません（active=TRUE を確認してください）。");
        return;
      }

      const frag = document.createDocumentFragment();

      classes.forEach(c => {
        const card = document.createElement("div");
        card.className = "card";
        card.dataset.classId = c.class_id;

        const isToday = String(c.weekday) === today;
        if (isToday) card.classList.add("today");
        if (String(c.class_id) === String(selectedClassId)) card.classList.add("selected");

        // 左上：今日バッジ
        if (isToday){
          const badge = document.createElement("div");
          badge.className = "badge-today";
          badge.textContent = "今日";
          card.appendChild(badge);
        }

        // 右上：選択ドット
        const dot = document.createElement("div");
        dot.className = "dot";
        card.appendChild(dot);

        const row1 = document.createElement("div");
        row1.className = "row1";

        const name = document.createElement("div");
        name.className = "name";
        name.textContent = c.class_name || "(no name)";
        row1.appendChild(name);

        const meta = document.createElement("div");
        meta.className = "meta";

        const chipDay = document.createElement("span");
        chipDay.className = "chip";
        chipDay.textContent = "曜日：" + (c.weekday || "-");
        meta.appendChild(chipDay);

        if (c.location){
          const chipLoc = document.createElement("span");
          chipLoc.className = "chip";
          chipLoc.textContent = "場所：" + c.location;
          meta.appendChild(chipLoc);
        }

        if (c.instructor){
          const chipIns = document.createElement("span");
          chipIns.className = "chip";
          chipIns.textContent = "担当：" + c.instructor;
          meta.appendChild(chipIns);
        }

        row1.appendChild(meta);
        card.appendChild(row1);

        card.addEventListener("click", () => onSelectClass_(c.class_id));
        frag.appendChild(card);
      });

      elGrid.appendChild(frag);
    }

    /******************************************************************
     * 3) JSONPユーティリティ（表示は出さない）
     ******************************************************************/
    function jsonp_(url, callbackName, timeoutMs = 15000){
      return new Promise((resolve, reject) => {
        const script = document.createElement("script");
        const timer = setTimeout(() => {
          cleanup_();
          reject(new Error("JSONP timeout"));
        }, timeoutMs);

        function cleanup_(){
          clearTimeout(timer);
          script.remove();
          try { delete window[callbackName]; } catch(e) { window[callbackName] = undefined; }
        }

        window[callbackName] = (data) => {
          cleanup_();
          resolve(data);
        };

        script.src = url;
        script.onerror = () => {
          cleanup_();
          reject(new Error("JSONP load error"));
        };

        document.body.appendChild(script);
      });
    }

    /******************************************************************
     * 4) GAS呼び出し（classes取得 / checkin）
     * ※ 既存のGASパラメータ仕様に合わせて、必要ならURLのクエリ名だけ調整してください
     ******************************************************************/
    async function fetchActiveClasses_(){
      setStatus_("同期中…");
      // 想定：GAS doGet で p.mode === 'classes' など
      // 例: /exec?mode=classes&callback=cb_classes
      const url = GAS_ENDPOINT
        + "?mode=classes"
        + "&callback=" + encodeURIComponent(JSONP_CALLBACK_CLASSES);

      const res = await jsonp_(url, JSONP_CALLBACK_CLASSES);

      // 想定レスポンス：{ ok:true, classes:[...] } or 直接配列
      const list = Array.isArray(res) ? res : (res && res.classes ? res.classes : []);
      if (!list.length) return [];

      // active=TRUE のみ（念のためフロントでもフィルタ）
      return list.filter(x => String(x.active).toUpperCase() === "TRUE");
    }

    async function postCheckin_(classId){
      setStatus_("チェックイン中…");

      // 想定：/exec?mode=checkin&class_id=...&line_user_id=...&callback=cb_checkin
      // ※初回の電話番号紐付け等はGAS側で処理済み、ここは userId でチェックインのみ
      const url = GAS_ENDPOINT
        + "?mode=checkin"
        + "&class_id=" + encodeURIComponent(classId)
        + "&line_user_id=" + encodeURIComponent(lineUserId)
        + "&callback=" + encodeURIComponent(JSONP_CALLBACK_CHECKIN);

      const res = await jsonp_(url, JSONP_CALLBACK_CHECKIN);

      // 想定レスポンス：{ ok:true, message:"...", redirect_url:"..." } 等
      if (res && (res.ok === true || res.status === "ok")) return res;

      const msg = (res && (res.message || res.error)) ? (res.message || res.error) : "チェックインに失敗しました。";
      throw new Error(msg);
    }

    /******************************************************************
     * UIイベント
     ******************************************************************/
    async function onSelectClass_(classId){
      try{
        clearMessages_();
        selectedClassId = String(classId);
        // 選択状態描画更新
        document.querySelectorAll(".card").forEach(el => {
          el.classList.toggle("selected", el.dataset.classId === selectedClassId);
        });

        // チェックイン実行
        elReload.disabled = true;
        const res = await postCheckin_(selectedClassId);

        showSuccess_(res && res.message ? res.message : "チェックイン完了しました。");

        // 2.5秒後にショップカードへ（GASがredirect_urlを返すならそれ優先）
        const to = (res && res.redirect_url) ? res.redirect_url : SHOP_CARD_URL;
        setTimeout(() => {
          if (to && typeof to === "string") location.href = to;
        }, 2500);

      }catch(err){
        showError_(err && err.message ? err.message : "チェックインに失敗しました。");
      }finally{
        elReload.disabled = false;
      }
    }

    elReload.addEventListener("click", () => initFlow_());

    /******************************************************************
     * LIFF初期化 → classes取得 → 並べ替え → 描画
     ******************************************************************/
    async function initFlow_(){
      try{
        clearMessages_();
        elReload.disabled = true;

        setStatus_("起動中…");

        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()){
          // ログイン画面へ（UIには何も出さない）
          liff.login();
          return;
        }

        const prof = await liff.getProfile();
        lineUserId = prof && prof.userId ? prof.userId : "";
        if (!lineUserId){
          throw new Error("LINE userId が取得できませんでした。");
        }

        const fetched = await fetchActiveClasses_();
        classes = sortClasses_(fetched);     // ★要件1：固定順ソート
        renderClasses_();

      }catch(err){
        showError_(err && err.message ? err.message : "初期化に失敗しました。");
      }finally{
        elReload.disabled = false;
      }
    }

    // 起動
    initFlow_();
  </script>
</body>
</html>
