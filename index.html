<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />

  <title>SoL 受講手続き</title>

  <style>
    :root{
      --bg0:#06070a; --bg1:#0b0d12;
      --card: rgba(255,255,255,.06); --card2: rgba(255,255,255,.035);
      --line: rgba(255,255,255,.10);
      --text:#eaf0ff; --muted:#a9b4d0;
      --accent:#7c5cff; --accent2:#2dd4bf;
      --danger:#ff4d6d; --ok:#22c55e;
      --radius: 18px; --shadow: 0 24px 80px rgba(0,0,0,.55);
    }
    *{ box-sizing:border-box; }
    body{
      margin:0; min-height:100vh; color:var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background:
        radial-gradient(1200px 700px at 10% -10%, rgba(124,92,255,.38), transparent 55%),
        radial-gradient(900px 600px at 90% 0%, rgba(45,212,191,.20), transparent 55%),
        radial-gradient(700px 500px at 50% 110%, rgba(124,92,255,.16), transparent 60%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      padding: calc(14px + env(safe-area-inset-top)) 14px calc(22px + env(safe-area-inset-bottom));
      display:flex; justify-content:center; align-items:flex-start;
    }
    .wrap{ width: min(520px, 100%); }

    .brand{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin: 4px 2px 12px; }
    .brandLeft{ display:flex; align-items:center; gap:10px; min-width:0; }
    .logo{
      width:42px; height:42px; border-radius:14px; overflow:hidden; flex:0 0 auto;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--line);
      box-shadow: 0 12px 28px rgba(0,0,0,.25);
      display:flex; align-items:center; justify-content:center;
    }
    .logo img{ width:100%; height:100%; object-fit:cover; display:block; }
    .brandText{ min-width:0; }
    .brandText .title{ margin:0; font-size:18px; font-weight:900; letter-spacing:.2px; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .brandText .subtitle{ margin:2px 0 0; font-size:12px; color:rgba(169,180,208,.85); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .pill{ font-size:12px; color:var(--muted); border:1px solid var(--line); padding:7px 10px; border-radius:999px; background: rgba(255,255,255,.03); }

    .card{ background: linear-gradient(180deg, var(--card), var(--card2)); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; }
    .cardHeader{ padding:18px 18px 14px; border-bottom:1px solid var(--line); background: rgba(255,255,255,.02); }
    .cardHeader h2{ margin:0 0 6px; font-size:20px; font-weight:900; letter-spacing:.2px; }
    .cardHeader p{ margin:0; font-size:12px; color:rgba(169,180,208,.92); line-height:1.55; }
    .content{ padding:16px 18px 18px; }

    .banner{
      display:none; border: 1px solid var(--line); background: rgba(255,255,255,.03);
      padding: 12px 12px; border-radius: 14px; margin-bottom: 12px;
      font-size: 13px; line-height: 1.45;
    }
    .banner.show{ display:block; }
    .banner.danger{ border-color: rgba(255,77,109,.38); background: rgba(255,77,109,.10); color:#ffd3dc; }
    /* 追加：info（今日のクラス0件など、エラーではない案内） */
    .banner.info{ border-color: rgba(169,180,208,.26); background: rgba(169,180,208,.08); color: rgba(234,240,255,.92); }

    .hintBanner{
      display:none; margin-bottom:12px; border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.04); padding:10px 12px; border-radius:14px;
      font-size:12px; color:rgba(169,180,208,.95); line-height:1.5;
    }
    .hintBanner.show{ display:block; }

    label{ display:block; font-size:12px; color:rgba(169,180,208,.95); margin: 10px 2px 6px; }

    .grid{ display:grid; grid-template-columns: 1fr; gap:10px; margin-top:8px; }
    @media (min-width: 420px){ .grid{ grid-template-columns: 1fr 1fr; } }

    .sectionTag{
      margin-top: 12px;
      padding-top: 8px;
      border-top: 1px solid rgba(255,255,255,.08);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
    }
    .sectionTag .left{
      font-size: 12px;
      color: rgba(169,180,208,.92);
    }
    .sectionTag .right{
      font-size: 12px;
      color: rgba(169,180,208,.72);
    }

    .classCard{
      border:1px solid var(--line);
      background: rgba(255,255,255,.03);
      border-radius:16px;
      padding:12px;
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      cursor:pointer; user-select:none;
      transition: transform .08s ease, border-color .15s ease, background .15s ease, opacity .15s ease;
      position: relative;
      overflow: hidden;
    }
    .classCard:active{ transform: translateY(1px); }
    .className{ font-size:15px; font-weight:800; letter-spacing:.1px; line-height:1.2; }
    .classMeta{ font-size:12px; color:rgba(169,180,208,.85); margin-top:2px; }

    /* 右側の「今日ラベル + 選択ドット」横並び */
    .rightWrap{
      display:flex;
      align-items:center;
      gap:8px;
      flex:0 0 auto;
      min-width: fit-content;
    }

    .dot{
      width:10px; height:10px; border-radius:999px;
      border:1px solid rgba(255,255,255,.22); background: rgba(255,255,255,.06);
      flex:0 0 auto;
    }

    /* 選択状態（既存） */
    .classCard.selected{
      border-color: rgba(124,92,255,.55);
      background: linear-gradient(135deg, rgba(124,92,255,.22), rgba(45,212,191,.12));
      box-shadow: 0 12px 30px rgba(124,92,255,.10);
    }
    .classCard.selected .dot{ background: linear-gradient(135deg, var(--accent), var(--accent2)); border-color: rgba(255,255,255,.22); }

    /* ===== 今日の曜日のカード強調 ===== */
    .classCard.today{
      border-color: rgba(45,212,191,.55);
      background: linear-gradient(135deg, rgba(45,212,191,.14), rgba(124,92,255,.12));
      box-shadow: 0 14px 36px rgba(45,212,191,.12);
    }
    .classCard.today::before{
      content:"";
      position:absolute; inset:-1px;
      background: linear-gradient(135deg, rgba(45,212,191,.55), rgba(124,92,255,.55));
      opacity:.22;
      pointer-events:none;
      border-radius:16px;
      mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      padding:1px;
      -webkit-mask-composite: xor;
      mask-composite: exclude;
    }
    .classCard.today .dot{
      background: rgba(45,212,191,.22);
      border-color: rgba(45,212,191,.38);
    }

    /* 「今日」ラベル（右側・横並び用） */
    .todayBadge{
      font-size:11px;
      font-weight:900;
      padding:5px 8px;
      border-radius:999px;
      color:#0b0d12;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      box-shadow: 0 10px 24px rgba(124,92,255,.14);
      line-height: 1;
      white-space: nowrap;
    }

    /* 追加：チェックイン済み「済」ラベル */
    .doneBadge{
      font-size:11px;
      font-weight:900;
      padding:5px 8px;
      border-radius:999px;
      color:#0b0d12;
      background: rgba(34,197,94,.95);
      box-shadow: 0 10px 24px rgba(34,197,94,.16);
      line-height: 1;
      white-space: nowrap;
    }

    /* 追加：チェックイン済みカード（タップ不可） */
    .classCard.done{
      opacity: .55;
      cursor: not-allowed;
      transform: none !important;
      border-color: rgba(34,197,94,.30);
      background: rgba(255,255,255,.02);
      box-shadow: none;
    }
    .classCard.done::before{ display:none; }
    .classCard.done .dot{
      background: rgba(34,197,94,.20);
      border-color: rgba(34,197,94,.30);
    }

    .field{
      background: rgba(255,255,255,.03);
      border:1px solid var(--line);
      border-radius:14px;
      padding:12px;
      display:flex; align-items:center; gap:10px;
      margin-top:8px;
    }
    .field input{
      width:100%; border:0; outline:none; background:transparent;
      color:var(--text); font-size:16px;
    }
    .field input::placeholder{ color: rgba(169,180,208,.65); }
    .hint{ font-size:12px; color:rgba(169,180,208,.80); margin-top:6px; }

    .btn{
      width:100%; margin-top:14px; border:0; border-radius:16px; padding:14px;
      font-size:16px; font-weight:900; color:#0b0d12; cursor:pointer;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 14px 40px rgba(124,92,255,.22);
      transition: transform .08s ease, opacity .15s ease;
    }
    .btn:active{ transform: translateY(1px); }
    .btn:disabled{ opacity:.55; cursor:not-allowed; }

    .metaRow{ display:flex; gap:10px; align-items:center; justify-content:space-between; margin-top:12px; }
    .mini{ font-size:12px; color:rgba(169,180,208,.78); max-width:70%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    .miniLoad{
      display:flex; align-items:center; gap:8px;
      font-size:12px; color:rgba(169,180,208,.85);
      margin: 10px 2px 0;
    }
    .miniSpin{
      width:14px; height:14px; border-radius:50%;
      border:2px solid rgba(255,255,255,.18);
      border-top-color: rgba(255,255,255,.8);
      animation: spin .85s linear infinite;
    }
    @keyframes spin{ to{ transform: rotate(360deg); } }

    .successView{ display:none; text-align:center; padding: 18px 18px 20px; }
    .successView.show{ display:block; }
    .check{
      width:58px; height:58px; margin:4px auto 10px; border-radius:18px;
      background: rgba(34,197,94,.14); border:1px solid rgba(34,197,94,.25);
      display:flex; align-items:center; justify-content:center;
      color:#b9ffd4; font-size:30px; font-weight:900;
    }
    .successView h3{ margin:6px 0 6px; font-size:18px; letter-spacing:.2px; font-weight:900; }
    .successView p{ margin:0; color:rgba(169,180,208,.92); font-size:13px; line-height:1.55; }
    .countdown{ margin-top:10px; font-size:12px; color:rgba(169,180,208,.85); }

    .footer{ text-align:center; margin-top:12px; font-size:12px; color:rgba(169,180,208,.72); }

@media (prefers-reduced-motion: reduce){
  *{ animation: none !important; transition: none !important; scroll-behavior: auto !important; }

/* ページ初期フェード */
.wrap{
  animation: pageIn .28s ease-out both;
}
@keyframes pageIn{
  from{ opacity:0; transform: translateY(8px); }
  to{ opacity:1; transform: translateY(0); }
}

/* カード：ホバー/タップの質感（transformのみで軽量） */
.classCard{
  will-change: transform;
}
.classCard:active{
  transform: translateY(1px) scale(.995);
}

/* 追加：今日バッジに軽い鼓動（視線誘導） */
.classCard.today .todayBadge{
  animation: pulseSoft 1.8s ease-in-out infinite;
  transform-origin: 30% 50%;
}
@keyframes pulseSoft{
  0%,100%{ transform: translateZ(0) scale(1); filter: saturate(1); }
  50%{ transform: translateZ(0) scale(1.04); filter: saturate(1.15); }
}

/* 追加：選択されたカードに“入り” */
.classCard.selected{
  animation: selectFade .16s ease-out;
}
@keyframes selectFade{
  from{ opacity:.86; }
  to{ opacity:1; }
}

/* バナーの出現を滑らかに */
.banner.show{
  animation: bannerIn .18s ease-out both;
}
@keyframes bannerIn{
  from{ opacity:0; transform: translateY(-6px); }
  to{ opacity:1; transform: translateY(0); }
}

/* 成功画面のチェックマークを少しだけ演出 */
.successView.show .check{
  animation: checkIn .22s ease-out both;
}
@keyframes checkIn{
  from{ opacity:0; transform: scale(.92); }
  to{ opacity:1; transform: scale(1); }
}
/* ===== selected を最優先で見せる（todayより勝たせる） ===== */

/* 1) selectedのカードを少しだけ“浮かせる” */
.classCard.selected{
  border-color: rgba(124,92,255,.78);
  box-shadow: 0 16px 44px rgba(124,92,255,.18);
  transform: translateY(-1px)scale(1.01); /* ほんの少しだけ。重くならない */
}

/* 2) ドットは selected が必ず勝つ（todayでも色が変わる） */
.classCard.selected .dot{
  background: linear-gradient(135deg, var(--accent), var(--accent2)) !important;
  border-color: rgba(255,255,255,.35) !important;
  box-shadow:
    0 0 0 4px rgba(124,92,255,.18),
    0 10px 26px rgba(124,92,255,.22);
}

/* 3) today + selected のときはさらに分かりやすく（最強状態） */
.classCard.today.selected{
  border-color: rgba(45,212,191,.78);
  box-shadow: 0 18px 50px rgba(45,212,191,.14);
}
.classCard.today.selected .dot{
  box-shadow:
    0 0 0 4px rgba(45,212,191,.16),
    0 10px 26px rgba(45,212,191,.20);
}

/* 4) “済”カードは selected 表示を無効化（誤タップ対策） */
.classCard.done.selected{
  transform: none;
  box-shadow: none;
}
.classCard.done.selected .dot{
  background: rgba(34,197,94,.20) !important;
  border-color: rgba(34,197,94,.30) !important;
  box-shadow: none;
}
/* ===== Dev Reset (開発用) ===== */
.devReset{
  margin: 10px auto 0;
  display:block;
  width: 100%;
  max-width: 520px;
  border: 1px solid rgba(255,255,255,.14);
  background: rgba(255,255,255,.03);
  color: rgba(234,240,255,.88);
  padding: 10px 12px;
  border-radius: 14px;
  font-size: 12px;
  font-weight: 800;
  cursor: pointer;
}
.devReset:active{ transform: translateY(1px); }

  </style>

  function jsonp(url){
    return new Promise((resolve, reject) => {
      const cb = "cb_" + Math.random().toString(36).slice(2);
      const script = document.createElement("script");
      const timer = setTimeout(() => {
        cleanup();
        reject(new Error("JSONP timeout"));
      }, JSONP_TIMEOUT_MS);

      function cleanup(){
        clearTimeout(timer);
        try { delete window[cb]; } catch(e) {}
        if (script && script.parentNode) script.parentNode.removeChild(script);
      }

      window[cb] = (data) => { cleanup(); resolve(data); };

      const sep = url.includes("?") ? "&" : "?";
      script.src = url + sep + "callback=" + cb;
      script.onerror = () => { cleanup(); reject(new Error("JSONP load error")); };
      document.body.appendChild(script);
    });
  }

  function normalizePhone(s){

  // ===== 曜日判定（JST） =====
  function getJstNow_(){
    const now = new Date();
    const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
    return new Date(utc + 9 * 60 * 60000);
  }
  function getJstWeekdayJa_(){
    const d = getJstNow_();
    const map = ["日","月","火","水","木","金","土"];
    return map[d.getDay()];
  }
  function formatJstYmdHm_(){
    const d = getJstNow_();
    const pad = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;

  function formatJstYmdCompact_(){

  }
  function normalizeWeekdayCell_(w){
    w = String(w || "").trim();
    w = w.replace(/曜日|曜/g, "");
    return w;
  }

  // 今日の曜日をグローバル保持（描画時に使う）
  let TODAY_WD = "";

  /* ===== 追加：本日チェックイン済み管理（端末側） ===== */
  function doneKeyToday_(){
    return DONE_CACHE_PREFIX + formatJstYmdCompact_();
  }
  function loadDoneToday_(){
    try{
      const raw = localStorage.getItem(doneKeyToday_());
      const arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr.map(String) : [];
    }catch(e){
      return [];
    }
  }
  function saveDoneToday_(arr){
    try{
      const unique = Array.from(new Set((arr || []).map(String)));
      localStorage.setItem(doneKeyToday_(), JSON.stringify(unique));
    }catch(e){}
  }
  function markDoneToday_(classId){
    const arr = loadDoneToday_();
    arr.push(String(classId));
    saveDoneToday_(arr);
  }
  function isDoneToday_(classId){
    const arr = loadDoneToday_();
    return arr.includes(String(classId));
  }
  /* ===================================================== */

  // ★ ここが並び順の固定（今日優先 + 月火水木金土日）
  function sortClassesByToday_(classes){
    const today = TODAY_WD || getJstWeekdayJa_();
    const wdOrder = { "月":0, "火":1, "水":2, "木":3, "金":4, "土":5, "日":6 };

    const orderKey = (c) => {
      const wd = normalizeWeekdayCell_(c.weekday);
      const isToday = (wd && wd === today) ? 0 : 1;                 // 今日を最優先
      const dayRank = (wd in wdOrder) ? wdOrder[wd] : 999;          // 月→…→日、それ以外は最後
      return { isToday, dayRank, wd };
    };

    return (classes || [])
      .map((c, i) => ({...c, __i:i}))
      .sort((a, b) => {
        const ka = orderKey(a);
        const kb = orderKey(b);

        if (ka.isToday !== kb.isToday) return ka.isToday - kb.isToday;
        if (ka.dayRank !== kb.dayRank) return ka.dayRank - kb.dayRank;

        // 同曜日内は名前で安定ソート（日本語）
        const an = String(a.name || "");
        const bn = String(b.name || "");
        if (an && bn) {
          const cmp = an.localeCompare(bn, "ja");
          if (cmp !== 0) return cmp;
        } else if (an && !bn) return -1;
        else if (!an && bn) return 1;

        return a.__i - b.__i;
      })
      .map(({__i, ...c}) => c);
  }

  function countTodayClasses_(classes){
    const today = TODAY_WD || getJstWeekdayJa_();
    return (classes || []).filter(c => normalizeWeekdayCell_(c.weekday) === today).length;
  }

  function renderClasses(classes, metaLabel){
    const grid = $("classGrid");
    grid.innerHTML = "";

    if (!classes || classes.length === 0){
      showBanner("現在選択できるクラスがありません。", "danger");
      return;
    }

    const doneSet = new Set(loadDoneToday_());

    classes.forEach(c => {
      const wd = normalizeWeekdayCell_(c.weekday);
      const isToday = wd && (wd === TODAY_WD);
      const isDone = doneSet.has(String(c.id));

      const card = document.createElement("div");
      card.className = "classCard"
        + (isToday ? " today" : "")
        + (isDone ? " done" : "");
      card.dataset.classId = String(c.id);

      const left = document.createElement("div");
      const name = document.createElement("div");
      name.className = "className";
      name.textContent = c.name;

      const meta = document.createElement("div");
      meta.className = "classMeta";
      if (wd) {
        if (isDone) meta.textContent = `${wd}｜チェックイン済み`;
        else if (isToday) meta.textContent = `${wd}｜今日`;
        else meta.textContent = `${wd}｜${metaLabel || "タップして選択"}`;
      } else {
        meta.textContent = metaLabel || "タップして選択";
      }

      left.appendChild(name);
      left.appendChild(meta);

      const right = document.createElement("div");
      right.className = "rightWrap";

      if (isDone) {
        const badge = document.createElement("div");
        badge.className = "doneBadge";
        badge.textContent = "済";
        right.appendChild(badge);
      } else if (isToday) {
        const badge = document.createElement("div");
        badge.className = "todayBadge";
        badge.textContent = "今日";
        right.appendChild(badge);
      }

      const dot = document.createElement("div");
      dot.className = "dot";
      right.appendChild(dot);

      card.appendChild(left);
      card.appendChild(right);

      // 追加：チェックイン済みはタップ無効（UIで二重防止）
      if (!isDone) {
        card.addEventListener("click", () => {
          hideBanner();
          setSelectedClass(String(c.id), String(c.name));
        });
      } else {
        card.style.pointerEvents = "none";
      }

      grid.appendChild(card);
    });
  }

  function saveClassesCache(classes){
    try{
      localStorage.setItem(CLASSES_CACHE_KEY, JSON.stringify({
        ts: Date.now(),
        classes: classes || []
      }));
    }catch(e){}
  }

  function loadClassesCache(){
    try{
      const raw = localStorage.getItem(CLASSES_CACHE_KEY);
      if(!raw) return null;
      const obj = JSON.parse(raw);
      if(!obj || !obj.ts || !Array.isArray(obj.classes)) return null;
      if(Date.now() - obj.ts > CLASSES_CACHE_TTL_MS) return null;
      return obj.classes;
    }catch(e){
      return null;
    }
  }

  function showSuccess(message){
    $("formBox").style.display = "none";
    hideMiniLoading();
    $("successView").classList.add("show");
    $("successMsg").textContent = message || "スタンプを付与します…";
  }

  function openStamp(){
    try {
      liff.openWindow({ url: STAMP_URL, external: false });
    } catch(e) {
      window.location.href = STAMP_URL;
    }
  }

  function startCountdown(ms){
    const el = $("countdown");
    if (!el) return;

    const start = Date.now();
    const tick = () => {
      const remain = Math.max(0, ms - (Date.now() - start));
      const sec = Math.ceil(remain / 1000);
      el.textContent = sec > 0 ? `${sec}秒後にスタンプ付与へ` : "移動します…";
      if (remain > 0) requestAnimationFrame(tick);
    };
    tick();
  }

  function applyTodayHeader_(){
    TODAY_WD = getJstWeekdayJa_();
    $("todayLabel").textContent = `受講クラス（${TODAY_WD}曜日 優先表示）`;
    $("todayJst").textContent = formatJstYmdHm_();
  }

  async function init(){
    hideBanner();
    applyTodayHeader_();
    wireDevReset_();


    $("netInfo").textContent = navigator.onLine ? "online" : "offline";

    const cached = loadClassesCache();
    if (cached && cached.length){
      $("formBox").style.display = "block";
      const sortedCached = sortClassesByToday_(cached);
      renderClasses(sortedCached, "前回の一覧（同期中）");
      showMiniLoading("最新のクラス一覧を同期中…");

      // 追加：今日0件UX（キャッシュ段階でも出しておく）
      const todayCountCached = countTodayClasses_(cached);
      if (todayCountCached === 0) {
        showBanner("本日のクラスはありません。次回のクラスから選択できます。", "info");
        $("todayLabel").textContent = `受講クラス（本日のクラスはありません）`;
      }
    }else{
      $("formBox").style.display = "block";
      showMiniLoading("起動中…");
    }

    await liff.init({ liffId: LIFF_ID });

    if (!liff.isInClient()) $("externalHint").classList.add("show");

    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }

    const profilePromise = liff.getProfile();
    const classesPromise = jsonp(`${API_URL}?api=classes&token=${encodeURIComponent(API_TOKEN)}`);

    const profile = await profilePromise;
    LINE_USER_ID = profile.userId;
    LINE_DISPLAY_NAME = profile.displayName || "";
    $("subInfo").textContent = LINE_DISPLAY_NAME ? `@${LINE_DISPLAY_NAME}` : "";

    const clsRes = await classesPromise;
    if (!clsRes || clsRes.status !== "success") {
      throw new Error(clsRes && clsRes.message ? clsRes.message : "classes load failed");
    }

    const classes = clsRes.classes || [];
    const sorted = sortClassesByToday_(classes);
    renderClasses(sorted, "タップして選択");
    saveClassesCache(classes);

    // 追加：今日0件UX（最新データで確定）
    const todayCount = countTodayClasses_(classes);
    if (todayCount === 0) {
      showBanner("本日のクラスはありません。次回のクラスから選択できます。", "info");
      $("todayLabel").textContent = `受講クラス（本日のクラスはありません）`;
    } else {
      // エラーでなければ、案内バナーは消す（dangerは残したいので init時に hideBanner 済み）
      // ここでは info のみ出しているので、0件でなければ非表示のままでOK
    }

    hideMiniLoading();
    $("checkinBtn").disabled = true;
  }

  async function checkin(){
    hideBanner();

    if (!SELECTED_CLASS || !SELECTED_CLASS.id) {
      showBanner("クラスを選択してください。", "danger");
      return;
    }

    // 追加：フロント側でも二重チェック防止
    if (isDoneToday_(SELECTED_CLASS.id)) {
      showBanner("このクラスは本日すでにチェックイン済みです。", "info");
      $("checkinBtn").disabled = true;
      return;
    }

    const phone = normalizePhone($("phoneInput").value);

    setBusy(true);
    showMiniLoading("チェックイン送信中…");

    try {
      const url =
        `${API_URL}?api=checkin` +
        `&token=${encodeURIComponent(API_TOKEN)}` +
        `&userId=${encodeURIComponent(LINE_USER_ID)}` +
        `&displayName=${encodeURIComponent(LINE_DISPLAY_NAME)}` +
        `&classId=${encodeURIComponent(SELECTED_CLASS.id)}` +
        `&className=${encodeURIComponent(SELECTED_CLASS.name)}` +
        (phone ? `&phone=${encodeURIComponent(phone)}` : "");

      const res = await jsonp(url);


if (res && res.status === "need_phone") {
  $("phoneWrap").style.display = "block";
  showBanner("初回のみ、会員登録時の電話番号（ハイフンなし）を入力してください。", "");
  setBusy(false);
  hideMiniLoading();
  return;
}

if (res && res.status === "already") {
  showBanner(res.message || "本日はすでにチェックイン済みです。", "info");
  setBusy(false);
  hideMiniLoading();
  return; // ★二重スタンプ付与防止
}

if (!res || res.status !== "success") {
  const msg = (res && res.message) ? res.message : "エラーが発生しました。";
  showBanner(msg, "danger");
  setBusy(false);
  hideMiniLoading();
  return;
}

// ===== 成功：本日チェックイン済みとして保存（UIで二重防止） =====
markDoneToday_(SELECTED_CLASS.id);

// 未払い案内（チェックインは成功のまま）
if (res.unpaid === true) {
  // バナーで出す場合（フォームはこのあと消えるので短時間）
  showBanner(res.message || "当月のお支払いが未確認です。", "info");

  // もしくは成功画面に出すならこちらがオススメ：
  // showSuccess(res.message || "当月のお支払いが未確認です。受付でお声がけください。");
  // startCountdown(REDIRECT_DELAY_MS);
  // setTimeout(openStamp, REDIRECT_DELAY_MS);
  // return;
}

showSuccess("スタンプを付与します…");
startCountdown(REDIRECT_DELAY_MS);

setTimeout(() => {
  openStamp();
}, REDIRECT_DELAY_MS);


    } catch (err) {
      showBanner("通信に失敗しました。電波の良い場所で再度お試しください。", "danger");
      setBusy(false);
      hideMiniLoading();
      console.error(err);
    }
  }

  init().catch(err => {
  hideMiniLoading();
  showBanner("起動に失敗しました： " + (err && err.message ? err.message : String(err)), "danger");
  console.error(err);
  });
</script>
</body>
